        const manualConfig = {};

        let db, auth, isFirebaseAvailable = false;
        try {
            if (Object.keys(firebaseConfig).length > 0) {
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();
                isFirebaseAvailable = true;
            } 
        } catch (e) { console.warn("Firebase hatası:", e); }
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kuran-siyer-app-v2';

        // --- GEMINI API YARDIMCISI ---
        const callGemini = async (prompt) => {
            const apiKey = localStorage.getItem('geminiApiKey') || ""; 
            if (!apiKey) throw new Error("Lütfen önce Ayarlar menüsünden Google Gemini API Anahtarınızı girip kaydediniz.");
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                if (!response.ok) { const err = await response.json(); throw new Error(err.error?.message || "AI Servisine ulaşılamadı."); }
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Cevap alınamadı.";
            } catch (error) { console.error("Gemini Error:", error); throw error; }
        };

        // --- SABİT VERİLER ---

        const getSurahTimelineData = (surah) => {
             const period = SIYER_PERIODS_DATA.find(p => surah.revelationType === 'Meccan'

             return {
                title: `${surah.revelationType === 'Meccan' ? 'Mekke' : 'Medine'} Dönemi`,

                before: { title: "Dönem", text: period.desc },
                revelation: { title: "Vahiy", text: "Ayetler bu dönemde topluma yol göstermek üzere nazil oldu." },
                after: { title: "Etki", text: "Müslümanların inancını pekiştirdi." }

        const DETAILED_CONTEXTS = {

            "93:1": { title: "Fetret Dönemi", color: "amber", before: { title: "Vahyin Kesilmesi", text: "Müşrikler 'Rabbi ona küstü' diyerek alay ediyordu." }, revelation: { title: "İlahî Cevap", text: "Rabbin seni terk etmedi ve darılmadı." }, after: { title: "Tekbir Sünneti", text: "Peygamberimiz sevincinden tekbir getirdi." } },
            "80:1": { title: "Ama Sahabe ve İkaz", color: "rose", before: { title: "Tebliğ Anı", text: "Peygamberimiz Mekke liderlerine İslam'ı anlatıyordu." }, revelation: { title: "Abese (Yüzünü Ekşitti)", text: "Görmeyen Abdullah gelince yüzünü ekşittiği için uyarıldı." }, after: { title: "İkram", text: "Peygamberimiz ona hep iltifat etti." } },

        const Loading = () => (

            if (!highlight || !highlight.trim()) return <span>{text}</span>;
            const escapeRegExp = (string) => string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const parts = text.split(new RegExp(`(${escapeRegExp(highlight)})`, 'gi'));
            
            return (
                <span>
                    {parts.map((part, i) => 
                        part.toLocaleLowerCase('tr') === highlight.toLocaleLowerCase('tr') ? 
                        <span key={i} className="bg-yellow-500 text-black font-extrabold px-1 rounded shadow-md border border-yellow-600">{part}</span> : part
                    )}
                </span>
            );
        };

        const NuzulTimelineCard = ({ data, isRemote = false }) => {
            const colors = { indigo: "border-indigo-500 bg-indigo-900/40 text-indigo-100", amber: "border-amber-500 bg-amber-900/40 text-amber-100", rose: "border-rose-500 bg-rose-900/40 text-rose-100", slate: "border-slate-500 bg-slate-800 text-slate-100", emerald: "border-emerald-500 bg-emerald-900/40 text-emerald-100" };
            const activeClass = colors[data.color] || colors.indigo;
            return (
                <div className={`my-6 mx-2 rounded-2xl border-l-4 overflow-hidden relative ${activeClass} shadow-2xl animate-fade-in`}>
                    {isRemote && <div className="absolute top-2 right-2 bg-emerald-500 text-white text-[9px] font-bold px-2 py-1 rounded-full flex items-center gap-1 shadow-lg z-20"><Icons.CloudDownload size={10} /> CANLI</div>}
                    <div className="p-4 border-b border-white/10 flex items-center gap-2 bg-black/20"><Icons.BookOpen size={18} /><h3 className="font-bold text-lg tracking-wide">{data.title}</h3></div>
                    <div className="p-4 relative">
                        <div className="absolute left-[15px] top-6 bottom-6 w-0.5 bg-white/20 z-0"></div>
                        {[data.before, data.revelation, data.after].map((step, i) => (
                            <div key={i} className="relative z-10 flex gap-4 mb-4 last:mb-0">
                                <div className={`w-8 h-8 rounded-full flex items-center justify-center bg-slate-900 border border-white/20 shadow-lg shrink-0`}>{i===0?<Icons.History size={14}/>:i===1?<Icons.Sparkles size={14}/>:<Icons.CheckCircle size={14}/>}</div>
                                <div><h4 className="text-xs font-bold uppercase opacity-70">{i===0?'Önce':i===1?'Nüzul':'Sonra'}</h4><h5 className="font-bold text-sm">{step?.title}</h5><p className="text-sm opacity-90">{step?.text}</p></div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const AiAnalysisModal = ({ isOpen, onClose, content, isLoading, error, type }) => {
            if (!isOpen) return null;
            const titles = { verse: 'Siyer Analizi', summary: 'Sure Özeti', chat: 'Siyer Asistanı', dua: 'Manevi Reçete', child: 'Çocuklar İçin', story: 'Günün Kıssası', action: 'Amel Planı', quiz: 'Bilgi Yarışması', concepts: 'Kelime Analizi', comparison: 'Tefsir Karşılaştırması', tajweed: 'Tecvid Analizi', related: 'Benzer Ayetler' };
            const displayTitle = titles[type] || 'AI Analizi';
            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4" onClick={onClose}>
                    <div className="w-full max-w-lg bg-slate-900 border border-emerald-500/30 rounded-3xl overflow-hidden shadow-2xl relative flex flex-col max-h-[85vh]" onClick={e => e.stopPropagation()}>

                            <h3 className="font-bold text-lg text-white">AI: {displayTitle}</h3>

        const SettingsModal = ({ isOpen, onClose, geminiKey, setGeminiKey, fontSize, setFontSize }) => {

            const [tempKey, setTempKey] = React.useState(geminiKey);
            const [saved, setSaved] = React.useState(false);

            const handleSave = () => {
                setGeminiKey(tempKey);
                localStorage.setItem('geminiApiKey', tempKey);
                setSaved(true);
                setTimeout(() => setSaved(false), 2000);
            };

            return (
                <div className="fixed inset-0 z-[80] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4" onClick={onClose}>

                            <label className="text-xs font-bold text-emerald-400 mb-2 block">Google Gemini API Anahtarı</label>

                    </div>
                </div>
            );
        };
        
        // --- JUMP TO (HIZLI GİT) MODAL ---
        const JumpToModal = ({ isOpen, onClose, setCurrentSurah, setView }) => {
            if(!isOpen) return null;
            const [inputVal, setInputVal] = React.useState('');
            
            const handleJump = () => {
                const parts = inputVal.split(':');
                if(parts.length === 2) {
                    const surahNo = parseInt(parts[0]);
                    const ayahNo = parseInt(parts[1]);
                    if(surahNo > 0 && surahNo <= 114) {
                         // Find surah info - simplified since we don't have full list in modal scope easily, 
                         // but we can pass a dummy object enough to trigger fetch
                         // ideally we should pass surahs list, but for simplicity:
                         setCurrentSurah({number: surahNo, revelationType: 'Meccan', numberOfAyahs: 286}); // details fetched in detail view
                         setView('surah');
                         // Store target ayah in sessionStorage to scroll after load

                         onClose();

                }

            const [translation, setTranslation] = React.useState([]);

            const [remoteContexts, setRemoteContexts] = React.useState({});

            React.useEffect(() => {
                setDetailLoading(true);
                const mealSourceObj = MEAL_SOURCES.find(m => m.id === 'tr.diyanet');

                        <button onClick={() => handleAiRequest(`Sen bir sınav hazırlayıcısısın. "${trName} Suresi" ile ilgili 5 soru hazırla.`, 'quiz')} className="flex items-center gap-1 px-3 py-1 bg-amber-500/20 text-amber-400 rounded-full text-xs font-bold whitespace-nowrap"><Icons.Award size={14}/> Sınav</button>

                            const isPlaying = playingAyah?.id === ayah.number;
                            const isLastRead = lastRead?.surahNo === surah.number && lastRead?.ayahNo === ayah.numberInSurah;
                            const contextData = remoteContexts[String(ayah.numberInSurah)] || DETAILED_CONTEXTS[`${surah.number}:${ayah.numberInSurah}`];

                            return (
                                <div key={ayah.number} id={`ayah-${ayah.numberInSurah}`}>
                                    {contextData && <NuzulTimelineCard data={contextData} isRemote={!!remoteContexts[String(ayah.numberInSurah)]} />}
                                    <div className={`relative p-4 rounded-2xl transition-all ${isPlaying ? 'bg-slate-800 border-l-4 border-emerald-500' : 'bg-slate-800'} shadow-sm ${isLastRead ? 'ring-2 ring-emerald-500/50' : ''}`}>

                                                    <Icons.BookOpen size={16} />
                                                </button>
                                            </div>
                                            
                                            {/* Scrollable Action Buttons */}
                                            <div className="flex gap-2 overflow-x-auto scrollbar-hide max-w-[180px] sm:max-w-none pl-2">

                                                <button onClick={() => handleAiRequest(`Aşağıdaki ayetin kelime analizini yap: ${ayah.text}`, 'concepts')} className="p-2 text-fuchsia-400"><Icons.ZoomIn size={16}/></button>
                                                <button onClick={() => handleAiRequest(`Şu ayet ile benzer konulu başka ayetleri bul: ${trText}`, 'related')} className="p-2 text-sky-400"><Icons.Link size={16}/></button>
                                                <button onClick={() => handleAiRequest(`Bu ayeti fıkhi, tasavvufi ve güncel açıdan yorumla: ${trText}`, 'comparison')} className="p-2 text-emerald-400"><Icons.Scale size={16}/></button>
                                                <button onClick={() => handleAiRequest(`Bu ayetin tecvid analizini yap: ${ayah.text}`, 'tajweed')} className="p-2 text-rose-400"><Icons.Activity size={16}/></button>
                                                <button onClick={() => handleAiRequest(`Aşağıdaki ayeti çocuklar için anlat: ${trText}`, 'child')} className="p-2 text-orange-400"><Icons.Baby size={16}/></button>
                                                <button onClick={() => handleAiRequest(`Aşağıdaki ayetin nüzul sebebini ve siyer bağlamını anlat: ${ayah.text}`, 'verse')} className="p-2 text-indigo-400"><Icons.Sparkles size={16}/></button>
                                                <button onClick={() => toggleFavorite(ayah, surah)} className={`p-2 ${isFav ? 'text-rose-500' : 'text-slate-400'}`}><Icons.Heart size={16} fill={isFav?"currentColor":"none"}/></button>
                                            </div>
                                        </div>
                                        
                                        <p className="text-right font-amiri leading-[2.4] mb-4 text-emerald-500 dir-rtl text-2xl">{ayah.text}</p>
                                        <div className="leading-relaxed font-serif text-gray-300" style={{fontSize: `${fontSize}px`}}>
                                            <HighlightedText text={trText} highlight={highlightedSearch} />
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const Home = ({ surahs, searchQuery, setSearchQuery, setCurrentSurah, setView, chatQuery, setChatQuery, handleGeneralChat, duaQuery, setDuaQuery, handleDuaRequest, handleAiRequest, setShowSettings, performDeepSearch, searchResults, isSearching, lastRead, setJumpModalOpen }) => {
            
            const handleSearchTrigger = () => {
                if (searchQuery.length > 2) {
                    performDeepSearch(searchQuery);
                }
            };

            return (
                <div className="min-h-screen pb-24 bg-slate-950 text-slate-100">
                    <div className="relative p-6 pt-8 pb-8 bg-gradient-to-br from-emerald-900 via-slate-900 to-black rounded-b-[3rem] shadow-2xl mb-6">
                        {/* Header with Settings */}
                        <div className="flex justify-between items-center mb-6">
                            <button onClick={() => setJumpModalOpen(true)} className="p-2 bg-white/10 rounded-full hover:bg-white/20 transition-colors border border-white/10 text-white"><Icons.Compass size={20} /></button>
                            <h1 className="text-3xl font-amiri text-white text-center drop-shadow-md">Kuran & Siyer Atlası</h1>
                            <button onClick={() => setShowSettings(true)} className="p-2 bg-white/10 rounded-full hover:bg-white/20 transition-colors border border-white/10"><Icons.Settings size={20} /></button>
                        </div>
                        
                        {/* LAST READ CARD */}
                        {lastRead && (
                            <div onClick={() => { setCurrentSurah(surahs.find(s => s.number === lastRead.surahNo)); setView('surah'); }} className="mb-6 mx-auto max-w-sm bg-white/5 border border-white/10 rounded-xl p-3 flex items-center justify-between cursor-pointer hover:bg-white/10 transition-all">
                                <div className="flex items-center gap-3">
                                    <div className="p-2 bg-emerald-500/20 text-emerald-400 rounded-full"><Icons.BookOpen size={16}/></div>
                                    <div>
                                        <p className="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Kaldığın Yer</p>
                                        <p className="text-sm font-bold text-white">{lastRead.surahName}, {lastRead.ayahNo}. Ayet</p>
                                    </div>
                                </div>
                                <Icons.ChevronLeft size={16} className="text-slate-500 rotate-180"/>
                            </div>
                        )}
                        
                        {/* DUA PANEL */}
                        <div className="mb-6 p-4 rounded-2xl bg-gradient-to-r from-violet-900/80 to-fuchsia-900/80 shadow-lg border border-white/10 backdrop-blur-sm relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-10"><Icons.Hands size={64}/></div>
                            <h3 className="font-bold text-white mb-3 flex items-center gap-2 text-sm uppercase tracking-wide relative z-10"><Icons.Hands size={16} /> Manevi Reçete & Dua</h3>
                            <div className="flex gap-2 mb-3 overflow-x-auto pb-2 custom-scrollbar relative z-10">
                                {['Hüzünlüyüm', 'Stresliyim', 'Şükür Doluyum', 'Rızık İstiyorum', 'Hasta Hissediyorum'].map((m, i) => (
                                    <button key={i} onClick={() => handleDuaRequest(m)} className="bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full text-xs whitespace-nowrap transition-colors border border-white/10">{m}</button>
                                ))}
                            </div>
                            <div className="flex bg-black/30 rounded-xl p-1 relative z-10 border border-white/5">
                                <input type="text" placeholder="Durumunu yaz..." className="flex-1 bg-transparent border-none outline-none text-white px-3 py-2 text-xs" value={duaQuery} onChange={(e) => setDuaQuery(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleDuaRequest()}/>
                                <button onClick={() => handleDuaRequest()} className="bg-fuchsia-600 p-2 rounded-lg"><Icons.Send size={14} /></button>
                            </div>
                        </div>

                        {/* CHAT & SEARCH */}
                        <div className="flex gap-2 mb-4">
                            <button onClick={() => handleAiRequest('Bana İslam tarihinden ibretlik bir kıssa anlat.', 'story')} className="bg-blue-600/20 border border-blue-500/30 rounded-xl p-3 text-blue-400 min-w-[50px] flex items-center justify-center"><Icons.Book size={20}/></button>
                            <div className="flex-1 bg-white/10 backdrop-blur-md rounded-xl p-1 border border-white/10 flex items-center shadow-lg">
                                <input type="text" placeholder="Siyer Asistanına sor..." className="flex-1 bg-transparent border-none outline-none text-white px-3 py-2 text-sm" value={chatQuery} onChange={(e) => setChatQuery(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleGeneralChat()}/>
                                <button onClick={handleGeneralChat} className="bg-emerald-500 p-2 rounded-lg"><Icons.Sparkles size={16} /></button>
                            </div>
                        </div>

                        {/* SEARCH BAR (DEEP SEARCH) */}
                        <div className="flex bg-slate-900/50 rounded-xl border border-slate-700 overflow-hidden items-center shadow-lg relative z-10">
                            <div className="pl-3 text-slate-400"><Icons.Search size={18} /></div>
                            <input 
                                type="text" 
                                placeholder="Kuran'da ara (Örn: Miraç, Sabır)..." 
                                value={searchQuery} 
                                onChange={(e) => setSearchQuery(e.target.value)} 
                                onKeyDown={(e) => e.key === 'Enter' && handleSearchTrigger()}
                                className="flex-1 bg-transparent border-none outline-none text-white px-3 py-3 text-sm placeholder-slate-500 h-full"
                            />
                            <button 
                                onClick={handleSearchTrigger}
                                className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 font-bold text-xs transition-colors h-full flex items-center"
                            >
                                ARA
                            </button>
                        </div>
                    </div>

                    {/* RESULTS */}
                    {isSearching ? (
                        <div className="px-4 py-10 text-center opacity-50 flex flex-col items-center"><div className="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin mb-2"></div>Aranıyor...</div>
                    ) : searchQuery.length > 0 && searchResults.length > 0 ? (
                        <div className="px-4 space-y-3 pb-10">
                            <h3 className="font-bold text-emerald-400 mb-2 px-1">Arama Sonuçları ({searchResults.length})</h3>
                            {searchResults.map((res, i) => (
                                <div key={i} onClick={() => { setCurrentSurah({number: res.surah.number, revelationType: res.surah.revelationType, numberOfAyahs: res.surah.numberOfAyahs}); setView('surah'); }} className="p-4 rounded-xl bg-slate-900 border border-slate-800 cursor-pointer hover:border-emerald-500/50 transition-all">
                                    <div className="flex justify-between mb-2">
                                        <span className="font-bold text-emerald-400 text-sm bg-emerald-900/30 px-2 py-0.5 rounded">{getTurkishName(res.surah.number)} Suresi, {res.numberInSurah}. Ayet</span>
                                        <Icons.ChevronLeft size={14} className="text-slate-600 rotate-180"/>
                                    </div>
                                    <div className="text-sm opacity-90 line-clamp-3 leading-relaxed text-gray-300">
                                        <HighlightedText text={res.text} highlight={searchQuery} />
                                    </div>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="px-4 grid grid-cols-1 md:grid-cols-2 gap-3 mt-4 pb-10">
                            {surahs.filter(s => getTurkishName(s.number).toLowerCase().includes(searchQuery.toLowerCase())).map(surah => (
                                <div key={surah.number} onClick={() => { setCurrentSurah(surah); setView('surah'); }} className="flex items-center p-4 rounded-xl bg-slate-900 border border-slate-800 cursor-pointer hover:border-emerald-500/50 transition-all group">
                                    <div className="w-10 h-10 flex items-center justify-center rounded-lg bg-emerald-500/10 text-emerald-500 font-bold mr-4">{surah.number}</div>
                                    <div><h4 className="font-bold text-white">{getTurkishName(surah.number)}</h4><p className="text-xs text-slate-500">{surah.numberOfAyahs} Ayet</p></div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const Favorites = ({ favorites, toggleFavorite, surahs, setCurrentSurah, setView }) => (
            <div className="min-h-screen pb-20 bg-slate-950 text-slate-100 p-6 pt-10">
                <h2 className="text-2xl font-bold mb-6 flex items-center gap-2"><Icons.Heart className="text-rose-500"/> Favorilerim</h2>
                {favorites.length === 0 ? <p className="opacity-50 text-center mt-10">Henüz favori yok.</p> : (
                    <div className="space-y-3">
                        {favorites.map((fav, i) => (
                            <div key={i} className="p-4 rounded-xl bg-slate-900 border-l-4 border-rose-500 flex justify-between items-start">
                                <div>
                                    <p className="text-xs font-bold text-rose-400 mb-1">{fav.surahName}, {fav.ayahNo}</p>
                                    <p className="text-sm opacity-80 line-clamp-2">"{fav.text}"</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => {
                                        const s = surahs.find(x => x.number === fav.surahNo);
                                        if(s) { setCurrentSurah(s); setView('surah'); }
                                    }} className="text-emerald-500"><Icons.ChevronLeft size={16} className="rotate-180"/></button>
                                    <button onClick={() => toggleFavorite({ numberInSurah: fav.ayahNo, text: fav.text }, { number: fav.surahNo })} className="text-slate-500 hover:text-rose-500"><Icons.X size={16}/></button>
                                </div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );

        // --- MAIN APP COMPONENT ---
        const KuranSiyerApp = () => {
            const [user, setUser] = React.useState(null);
            const [view, setView] = React.useState('home'); 
            const [surahs, setSurahs] = React.useState([]);
            const [currentSurah, setCurrentSurah] = React.useState(null);
            const [favorites, setFavorites] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [searchQuery, setSearchQuery] = React.useState('');
            const [searchResults, setSearchResults] = React.useState([]);
            const [isSearching, setIsSearching] = React.useState(false);
            const [darkMode, setDarkMode] = React.useState(true);
            const [showSettings, setShowSettings] = React.useState(false);
            const [geminiKey, setGeminiKey] = React.useState('');
            const [fontSize, setFontSize] = React.useState(18);
            const [chatQuery, setChatQuery] = React.useState('');
            const [duaQuery, setDuaQuery] = React.useState('');
            const [lastRead, setLastRead] = React.useState(null);
            const [jumpModalOpen, setJumpModalOpen] = React.useState(false);
            
            // AI States
            const [aiModalOpen, setAiModalOpen] = React.useState(false);
            const [aiContent, setAiContent] = React.useState('');
            const [aiLoading, setAiLoading] = React.useState(false);
            const [aiError, setAiError] = React.useState(null);
            const [aiMode, setAiMode] = React.useState('verse');
            
            // Audio
            const [playingAyah, setPlayingAyah] = React.useState(null);
            const audioRef = React.useRef(new Audio());

            // Deep Search Function
            const performDeepSearch = React.useCallback(async (query) => {
                if (query.length < 2) { setSearchResults([]); return; }
                setIsSearching(true);
                setSearchResults([]); // Clear previous
                try {
                    // Using alquran.cloud search API
                    const res = await fetch(`https://api.alquran.cloud/v1/search/${query}/all/tr.diyanet`);
                    const data = await res.json();
                    
                    if (data.code === 200 && data.data && data.data.matches) {
                        setSearchResults(data.data.matches);
                    } else {
                        setSearchResults([]);
                    }
                } catch (e) { 
                    console.error("Search error", e); 
                    setSearchResults([]);
                }
                finally { setIsSearching(false); }
            }, []);

            React.useEffect(() => {
                setGeminiKey(localStorage.getItem('geminiApiKey') || '');
                const savedLastRead = localStorage.getItem('lastRead');
                if(savedLastRead) setLastRead(JSON.parse(savedLastRead));
                
                // Local Favorites Init
                const localFavs = localStorage.getItem('favs');
                if(localFavs) setFavorites(JSON.parse(localFavs));

                const initAuth = async () => {
                    if (isFirebaseAvailable) {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await auth.signInWithCustomToken(__initial_auth_token);
                            else await auth.signInAnonymously();
                        } catch(e) { console.error("Auth", e); }
                    }
                };
                initAuth();
                if (isFirebaseAvailable) {
                    firebase.auth().onAuthStateChanged((currentUser) => {
                        setUser(currentUser);
                        if (currentUser) {
                             db.collection('artifacts').doc(appId).collection('users').doc(currentUser.uid).collection('favorites').doc('main')
                            .onSnapshot((docSnap) => { if (docSnap.exists) setFavorites(docSnap.data().list || []); }, (err) => {});
                        }
                    });
                }
                fetch('https://api.alquran.cloud/v1/surah').then(res => res.json()).then(data => { setSurahs(data.data); setLoading(false); });
            }, []);

            React.useEffect(() => {
                const audio = audioRef.current;
                const handleEnded = () => setPlayingAyah(null);
                audio.addEventListener('ended', handleEnded);
                if (playingAyah) {
                    audio.src = playingAyah.url;
                    audio.play().catch(e => console.error("Audio Error", e));
                } else { audio.pause(); }
                return () => { audio.removeEventListener('ended', handleEnded); audio.pause(); };
            }, [playingAyah]);

            const toggleAudio = (ayahUrl, id) => {
                if (playingAyah && playingAyah.id === id) setPlayingAyah(null);
                else setPlayingAyah({ url: ayahUrl, id });
            };

            const toggleFavorite = async (ayahData, surahInfo) => {
                const favItem = { surahNo: surahInfo.number, surahName: getTurkishName(surahInfo.number), ayahNo: ayahData.numberInSurah, text: ayahData.text.substring(0, 50) + "...", uid: `${surahInfo.number}:${ayahData.numberInSurah}` };
                let newFavs = [...favorites];
                const isFav = favorites.some(f => f.uid === favItem.uid);
                
                // Optimistic UI update for LocalStorage
                if(isFav) newFavs = newFavs.filter(f => f.uid !== favItem.uid); 
                else newFavs.push(favItem);
                setFavorites(newFavs); 
                localStorage.setItem('favs', JSON.stringify(newFavs));

                // Sync with Firebase if available
                if (isFirebaseAvailable && user) {
                    const docRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('favorites').doc('main');
                    try {
                        if (isFav) await docRef.update({ list: firebase.firestore.FieldValue.arrayRemove(favorites.find(f => f.uid === favItem.uid)) });
                        else {
                            const doc = await docRef.get();
                            if (!doc.exists) await docRef.set({ list: [favItem] });
                            else await docRef.update({ list: firebase.firestore.FieldValue.arrayUnion(favItem) });
                        }
                    } catch(e) { console.warn("Firebase sync failed, using local"); }
                }
            };

            const handleAiRequest = async (prompt, mode) => {
                setAiMode(mode); setAiModalOpen(true); setAiLoading(true); setAiError(null);
                try {
                    const result = await callGemini(prompt);
                    setAiContent(result);
                } catch (err) { setAiError(err.message); } finally { setAiLoading(false); }
            };

            const handleGeneralChat = () => {
                if (!chatQuery.trim()) return;
                handleAiRequest(`Sen bilgili bir İslam Siyer rehberisin. Kullanıcının sorusu: "${chatQuery}". Cevap Markdown formatında olsun.`, 'chat');
            };

            const handleDuaRequest = (mood) => {
                const query = mood || duaQuery;
                if (!query.trim()) return;
                handleAiRequest(`Sen manevi bir rehbersin. Kullanıcı durumu: "${query}". Ona uygun bir dua, esma ve tavsiye ver.`, 'dua');
            };

            if (loading) return <Loading />;

            return (
                <div className="font-sans antialiased">
                    {view === 'home' && <Home 
                        surahs={surahs} 
                        searchQuery={searchQuery} 
                        setSearchQuery={setSearchQuery} 
                        setCurrentSurah={setCurrentSurah} 
                        setView={setView} 
                        chatQuery={chatQuery} 
                        setChatQuery={setChatQuery} 
                        handleGeneralChat={handleGeneralChat} 
                        duaQuery={duaQuery} 
                        setDuaQuery={setDuaQuery} 
                        handleDuaRequest={handleDuaRequest}
                        handleAiRequest={handleAiRequest}
                        setShowSettings={setShowSettings}
                        performDeepSearch={performDeepSearch}
                        searchResults={searchResults}
                        isSearching={isSearching}
                        lastRead={lastRead}
                        setJumpModalOpen={setJumpModalOpen}
                    />}
                    
                    {view === 'surah' && currentSurah && <SurahDetail 
                        surah={currentSurah} 
                        setView={setView} 
                        handleAiRequest={handleAiRequest} 
                        setShowSettings={setShowSettings}
                        playingAyah={playingAyah}
                        toggleAudio={toggleAudio}
                        toggleFavorite={toggleFavorite}
                        favorites={favorites}
                        fontSize={fontSize}
                        lastRead={lastRead}
                        setLastRead={setLastRead}
                        highlightedSearch={searchQuery}
                        setJumpModalOpen={setJumpModalOpen}
                    />}
                    
                    {view === 'favorites' && <Favorites 
                        favorites={favorites} 
                        toggleFavorite={toggleFavorite} 
                        surahs={surahs} 
                        setCurrentSurah={setCurrentSurah} 
                        setView={setView} 
                    />}
                    
                    <SettingsModal 
                        isOpen={showSettings} 
                        onClose={() => setShowSettings(false)} 
                        geminiKey={geminiKey} 
                        setGeminiKey={setGeminiKey} 
                        fontSize={fontSize} 
                        setFontSize={setFontSize} 
                    />
                    
                    <JumpToModal 
                        isOpen={jumpModalOpen}
                        onClose={() => setJumpModalOpen(false)}
                        setCurrentSurah={setCurrentSurah}
                        setView={setView}
                    />
                    
                    <AiAnalysisModal 
                        isOpen={aiModalOpen} 
                        onClose={() => setAiModalOpen(false)} 
                        content={aiContent} 
                        isLoading={aiLoading} 
                        error={aiError} 
                        type={aiMode} 
                    />
                    
                    <div className="fixed bottom-0 left-0 right-0 py-3 px-6 flex justify-around items-center border-t border-slate-800 bg-slate-900/95 backdrop-blur-lg z-50">
                        <button onClick={() => setView('home')} className={`flex flex-col items-center gap-1 ${view === 'home' ? 'text-emerald-500' : 'text-slate-500'}`}><Icons.BookOpen size={24} /><span className="text-[10px]">Kuran</span></button>
                        <button onClick={() => setView('favorites')} className={`flex flex-col items-center gap-1 ${view === 'favorites' ? 'text-rose-500' : 'text-slate-500'}`}><Icons.Heart size={24} fill={view === 'favorites' ? "currentColor" : "none"} /><span className="text-[10px]">Favoriler</span></button>
                        <button onClick={() => setDarkMode(!darkMode)} className="flex flex-col items-center gap-1 text-slate-500 hover:text-amber-400">{darkMode ? <Icons.Sun size={24} /> : <Icons.Moon size={24} />}<span className="text-[10px]">Tema</span></button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<KuranSiyerApp />);
    </script>
</body>
</html>
