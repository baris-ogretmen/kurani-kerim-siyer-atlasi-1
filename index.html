            if(!isOpen || !ayahInfo) return null;
            const [query, setQuery] = React.useState('');

            const handleSubmit = () => {
                if(!query.trim()) return;
                onSubmit(query, ayahInfo);
                setQuery('');
            };

            return (
                <div className="fixed inset-0 z-[80] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in" onClick={onClose}>
                    <div className="w-full max-w-md bg-slate-900 rounded-3xl overflow-hidden shadow-2xl flex flex-col border border-emerald-500/30" onClick={e => e.stopPropagation()}>
                        <div className="p-5 bg-gradient-to-r from-emerald-900 to-slate-900 border-b border-white/10 flex justify-between items-center">
                            <h3 className="font-bold text-lg text-white flex items-center gap-2"><Icons.Sparkles size={20} className="text-emerald-400"/> Ayet Asistanına Sor</h3>
                            <button onClick={onClose} className="text-white hover:text-emerald-400 transition-colors"><Icons.X size={20}/></button>
                        </div>
                        <div className="p-6">
                            <div className="bg-slate-800/50 p-3 rounded-xl mb-4 text-sm border border-slate-700/50">
                                <span className="font-bold text-emerald-400">{surahName}, {ayahInfo.numberInSurah}. Ayet:</span>
                                <p className="text-gray-300 mt-1 line-clamp-2 italic">"{ayahInfo.trText}"</p>
                            </div>
                            <label className="text-xs font-bold text-emerald-400 mb-2 block">Bu ayet hakkında ne öğrenmek istersiniz?</label>
                            <textarea 
                                value={query} 
                                onChange={(e) => setQuery(e.target.value)} 
                                rows="3"
                                className="w-full p-3 rounded-xl bg-black/30 border border-slate-700 text-sm focus:border-emerald-500 outline-none resize-none mb-4" 
                                placeholder="Örn: Bu ayette bahsedilen sabır kavramını günlük hayatımda nasıl kullanabilirim?"
                            ></textarea>
                            <button onClick={handleSubmit} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white p-3 rounded-xl transition-colors flex items-center justify-center gap-2 font-bold shadow-lg shadow-emerald-900/50">
                                ✨ YAPAY ZEKAYA SOR
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const HomePromptModal = ({ promptConfig, isOpen, onClose, onSubmit }) => {
            if(!isOpen || !promptConfig) return null;
            const [query, setQuery] = React.useState('');

            const handleSubmit = () => {
                if(!query.trim()) return;
                onSubmit(`${promptConfig.prefix} "${query}"`, promptConfig.type, promptConfig.useSearch);
                setQuery('');
            };

            return (
                <div className="fixed inset-0 z-[80] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in" onClick={onClose}>
                    <div className="w-full max-w-md bg-slate-900 rounded-3xl overflow-hidden shadow-2xl flex flex-col border border-emerald-500/30" onClick={e => e.stopPropagation()}>
                        <div className="p-5 bg-gradient-to-r from-emerald-900 to-slate-900 border-b border-white/10 flex justify-between items-center">
                            <h3 className="font-bold text-lg text-white flex items-center gap-2"><Icons.Sparkles size={20} className="text-emerald-400"/> {promptConfig.title}</h3>
                            <button onClick={onClose} className="text-white hover:text-emerald-400 transition-colors"><Icons.X size={20}/></button>
                        </div>
                        <div className="p-6">
                            <input 
                                type="text"
                                value={query} 
                                onChange={(e) => setQuery(e.target.value)} 
                                onKeyDown={(e) => e.key === 'Enter' && handleSubmit()}
                                className="w-full p-4 rounded-xl bg-black/30 border border-slate-700 text-sm focus:border-emerald-500 outline-none mb-4" 
                                placeholder={promptConfig.placeholder}
                                autoFocus
                            />
                            <button onClick={handleSubmit} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white p-3 rounded-xl transition-colors flex items-center justify-center gap-2 font-bold shadow-lg shadow-emerald-900/50">
                                ✨ ANALİZ ET
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Kayıtlı el çizimini ayet kartı üzerinde gösteren (etkileşimsiz) katman
        const AyahDrawOverlay = ({ cizim }) => {
            if (!cizim || !cizim.strokes || !cizim.strokes.length) return null;
            const oran = cizim.oran || 0.5;
            return (
                <svg viewBox={`0 0 1 ${oran}`} preserveAspectRatio="none" className="absolute inset-0 w-full h-full pointer-events-none z-20" style={{ overflow: 'visible' }}>
                    {cizim.strokes.map((s, i) => (s.p && s.p.length) ? (
                        <polyline key={i} points={s.p.map(([x, y]) => `${x},${y}`).join(' ')} fill="none" stroke={s.renk} strokeWidth={s.kalinlik} strokeLinecap="round" strokeLinejoin="round" opacity={s.mod === 'hi' ? 0.4 : 1} vectorEffect="non-scaling-stroke" />
                    ) : null)}
                </svg>
            );
        };

        // Ayet kartı üzerinde elle serbest çizim/yazı modu
        const AyahDrawCanvas = ({ baslangic, onKaydet, onKapat }) => {
            const canvasRef = React.useRef(null);
            const wrapRef = React.useRef(null);
            const strokesRef = React.useRef((baslangic && baslangic.strokes) ? baslangic.strokes.map(s => ({ ...s, p: s.p.map(pt => [...pt]) })) : []);
            const cizimRef = React.useRef(false);
            const aktifRef = React.useRef(null);
            const [renk, setRenk] = React.useState('#f43f5e');
            const [mod, setMod] = React.useState('pen'); // pen | hi | eraser
            const [kalinlik, setKalinlik] = React.useState(3);
            const [, force] = React.useState(0);
            const RENKLER = ['#f43f5e', '#fbbf24', '#34d399', '#60a5fa', '#c084fc', '#ffffff'];
            const KALINLIKLAR = [{ ad: 'İnce', v: 2 }, { ad: 'Orta', v: 4 }, { ad: 'Kalın', v: 7 }];

            const ciz = () => {
                const c = canvasRef.current; if (!c) return;
                const ctx = c.getContext('2d');
                const W = c.clientWidth, H = c.clientHeight;
                ctx.clearRect(0, 0, W, H);
                strokesRef.current.forEach(s => {
                    if (!s.p.length) return;
                    ctx.beginPath(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                    ctx.strokeStyle = s.renk; ctx.lineWidth = s.kalinlik; ctx.globalAlpha = s.mod === 'hi' ? 0.35 : 1;
                    s.p.forEach(([nx, ny], i) => { const x = nx * W, y = ny * W; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
                    ctx.stroke();
                });
                ctx.globalAlpha = 1;
            };
            const boyutla = () => {
                const c = canvasRef.current, wrap = wrapRef.current; if (!c || !wrap) return;
                const r = wrap.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                c.width = Math.max(1, r.width * dpr); c.height = Math.max(1, r.height * dpr);
                c.style.width = r.width + 'px'; c.style.height = r.height + 'px';
                c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
                ciz();
            };
            React.useEffect(() => { boyutla(); const on = () => boyutla(); window.addEventListener('resize', on); return () => window.removeEventListener('resize', on); }, []);

            const noktaAl = (e) => {
                const c = canvasRef.current; const r = c.getBoundingClientRect();
                const W = c.clientWidth || 1;
                return [(e.clientX - r.left) / W, (e.clientY - r.top) / W];
            };
            const silNokta = (e) => {
                const [nx, ny] = noktaAl(e); const esik = 0.035;
                strokesRef.current = strokesRef.current.filter(s => !s.p.some(([x, y]) => Math.hypot(x - nx, y - ny) < esik));
                ciz();
            };
            const bas = (e) => {
                e.preventDefault();
                try { canvasRef.current.setPointerCapture(e.pointerId); } catch(_){}
                cizimRef.current = true;
                if (mod === 'eraser') { aktifRef.current = null; silNokta(e); return; }
                aktifRef.current = { renk, kalinlik: mod === 'hi' ? kalinlik * 3.5 : kalinlik, mod, p: [noktaAl(e)] };
                strokesRef.current.push(aktifRef.current); ciz();
            };
            const hareket = (e) => {
                if (!cizimRef.current) return; e.preventDefault();
                if (mod === 'eraser') { silNokta(e); return; }
                if (aktifRef.current) { aktifRef.current.p.push(noktaAl(e)); ciz(); }
            };
            const bitir = () => { cizimRef.current = false; aktifRef.current = null; };
            const geriAl = () => { strokesRef.current.pop(); ciz(); force(v => v + 1); };
            const temizle = () => { strokesRef.current = []; ciz(); force(v => v + 1); };
            const kaydet = () => {
                const c = canvasRef.current;
                const oran = (c.clientHeight || 1) / (c.clientWidth || 1);
                onKaydet({ oran, strokes: strokesRef.current.filter(s => s.p.length).map(s => ({ renk: s.renk, kalinlik: s.kalinlik, mod: s.mod, p: s.p.map(pt => [Math.round(pt[0] * 1000) / 1000, Math.round(pt[1] * 1000) / 1000]) })) });
            };

            return (
                <div ref={wrapRef} className="absolute inset-0 z-30 rounded-2xl overflow-hidden" style={{ touchAction: 'none' }}>
                    <div className="absolute inset-0 bg-slate-950/40 pointer-events-none"></div>
                    <canvas ref={canvasRef}
                        onPointerDown={bas} onPointerMove={hareket} onPointerUp={bitir} onPointerCancel={bitir} onPointerLeave={bitir}
                        className="absolute inset-0" style={{ touchAction: 'none', cursor: 'crosshair' }} />
                    <div className="absolute top-2 left-2 right-2 flex flex-wrap items-center gap-1.5 p-2 rounded-xl bg-slate-900/95 border border-slate-700 shadow-xl z-40" style={{ touchAction: 'auto' }}>
                        {RENKLER.map(r => <button key={r} onClick={() => { setRenk(r); if (mod === 'eraser') setMod('pen'); }} className={`w-6 h-6 rounded-full transition-transform ${renk === r && mod !== 'eraser' ? 'ring-2 ring-white scale-110' : 'ring-1 ring-white/25'}`} style={{ background: r }} />)}
                        <span className="w-px h-5 bg-slate-700 mx-0.5"></span>
                        <button onClick={() => setMod('pen')} className={`p-1.5 rounded-lg ${mod === 'pen' ? 'bg-emerald-500/25 text-emerald-300' : 'text-slate-300 hover:bg-slate-700'}`} title="Kalem"><Icons.Pencil size={15} /></button>
                        <button onClick={() => setMod('hi')} className={`p-1.5 rounded-lg ${mod === 'hi' ? 'bg-amber-500/25 text-amber-300' : 'text-slate-300 hover:bg-slate-700'}`} title="Fosforlu"><Icons.Highlighter size={15} /></button>
                        <button onClick={() => setMod('eraser')} className={`p-1.5 rounded-lg ${mod === 'eraser' ? 'bg-rose-500/25 text-rose-300' : 'text-slate-300 hover:bg-slate-700'}`} title="Silgi"><Icons.Eraser size={15} /></button>
                        <span className="w-px h-5 bg-slate-700 mx-0.5"></span>
                        {KALINLIKLAR.map(kl => (
                            <button key={kl.v} onClick={() => setKalinlik(kl.v)} title={kl.ad} className={`w-7 h-7 rounded-lg flex items-center justify-center transition-colors ${kalinlik === kl.v ? 'bg-emerald-500/25' : 'hover:bg-slate-700'}`}>
                                <span className="rounded-full bg-current" style={{ width: kl.v + 2, height: kl.v + 2, color: kalinlik === kl.v ? '#6ee7b7' : '#cbd5e1' }}></span>
                            </button>
                        ))}
                        <span className="w-px h-5 bg-slate-700 mx-0.5"></span>
                        <button onClick={geriAl} className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-700" title="Geri Al"><Icons.Undo2 size={15} /></button>
                        <button onClick={temizle} className="p-1.5 rounded-lg text-slate-300 hover:bg-slate-700" title="Hepsini Temizle"><Icons.Trash size={15} /></button>
                        <span className="flex-1 min-w-[8px]"></span>
                        <button onClick={onKapat} className="px-2.5 py-1 rounded-lg text-xs font-bold text-slate-300 hover:bg-slate-700">Vazgeç</button>
                        <button onClick={kaydet} className="px-3 py-1 rounded-lg text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white">Kaydet</button>
                    </div>
                </div>
            );
        };

        // ================= AYET ANATOMİSİ =================
        // Ayete dokununca: ayet kişilere, kavramlara, duygulara, emirlere... ayrılır; meal üzerinde renkli işaretlenir,
        // not kartları + kelime şeridi + dağılım haritası ile "kitabı parçalarına ayırma" görünümü. Sonuç cihazda önbelleğe alınır.
        const ANATOMI_KAT = [
            { k: 'kisi',     ad: 'Kişiler & Muhataplar',       kisa: 'Kişiler',   ikon: '👤', renk: '#60a5fa' },
            { k: 'esma',     ad: "Allah'ın İsim ve Sıfatları", kisa: 'Esmâ',      ikon: '✨', renk: '#f59e0b' },
            { k: 'kavram',   ad: 'Kavramlar',                  kisa: 'Kavramlar', ikon: '💎', renk: '#10b981' },
            { k: 'duygu',    ad: 'Duygu & Haller',             kisa: 'Duygular',  ikon: '💗', renk: '#ec4899' },
            { k: 'hukum',    ad: 'Emir, Yasak & Öğüt',         kisa: 'Emirler',   ikon: '⚖️', renk: '#ef4444' },
            { k: 'mujde',    ad: 'Müjde & Uyarı',              kisa: 'Müjde/Uyarı', ikon: '🕊️', renk: '#06b6d4' },
            { k: 'mekan',    ad: 'Mekân & Zaman',              kisa: 'Mekân/Zaman', ikon: '🧭', renk: '#8b5cf6' },
            { k: 'benzetme', ad: 'Benzetme & Sembol',          kisa: 'Benzetme',  ikon: '🎨', renk: '#f97316' },
        ];
        const ANATOMI_KAT_MAP = ANATOMI_KAT.reduce((o, c) => (o[c.k] = c, o), {});
        const anatomiAlfa = (hex, a) => { const h = hex.replace('#', ''); const n = parseInt(h, 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
        const anatomiAralik = (meal, frag) => {
            if (!meal || !frag) return null;
            const m = meal.toLocaleLowerCase('tr');
            let f = String(frag).toLocaleLowerCase('tr').trim().replace(/^["'“”‘’«»(\s…]+|["'“”‘’«».,;:!?)\s…]+$/g, '');
            if (f.length < 2) return null;
            let i = m.indexOf(f);
            if (i >= 0) return [i, i + f.length];
            const w = f.split(/\s+/);
            for (let n = Math.min(4, w.length - 1); n >= 2; n--) {
                const ff = w.slice(0, n).join(' ');
                i = m.indexOf(ff);
                if (i >= 0) return [i, i + ff.length];
            }
            return null;
        };
        const anatomiKelimeler = (ar) => String(ar || '').split(/\s+/).filter(w => /[ء-يٱ-ۓ]/.test(w));

        const AyetAnatomisi = ({ veri, onKapat, mealSource, arabicFont, showToast, handleAiRequest }) => {
            const { ayah, trText, trName } = veri;
            const no = ayah.numberInSurah;
            const kelimeler = React.useMemo(() => anatomiKelimeler(ayah.text), [ayah.text]);
            const cacheKey = `zirve_anatomi_v1_${veri.surahNo}:${no}_${mealSource || 'tr'}`;
            const [data, setData] = React.useState(() => { try { const c = localStorage.getItem(cacheKey); return c ? JSON.parse(c) : null; } catch (e) { return null; } });
            const [yukleniyor, setYukleniyor] = React.useState(false);
            const [hata, setHata] = React.useState(null);
            const [aktifKat, setAktifKat] = React.useState('hepsi');
            const [aktifParca, setAktifParca] = React.useState(null);  // {ei, pi}
            const [aktifKelime, setAktifKelime] = React.useState(null); // index
            const heroRef = React.useRef(null);

            const getir = async (zorla) => {
                if (!trText || trText === '...') { setHata('Bu ayetin meali henüz yüklenmedi.'); return; }
                if (!zorla && data) return;
                setYukleniyor(true); setHata(null); setAktifParca(null); setAktifKelime(null);
                const liste = kelimeler.slice(0, 90).map((w, i) => `${i + 1}) ${w}`).join('  ');
                const prompt = `Sen Kur'an ilimlerine (tefsir, lügat/sarf, belâgat) vakıf, titiz bir uzmansın. Aşağıdaki ayeti bir "AYET ANATOMİSİ" haritası için yapılandırılmış veriye ayır.

SURE / AYET: ${trName} Suresi, ${no}. ayet
ARAPÇA: ${ayah.text}
TÜRKÇE MEAL: ${trText}
ARAPÇA KELİMELER (numaralı): ${liste}

KURALLAR (doğruluk her şeyden önemli):
- Yalnızca BU ayette açıkça geçen ya da doğrudan kastedilen ögeleri etiketle; ayette olmayan kişi, olay veya hüküm EKLEME.
- "parcalar[].metin": yukarıdaki TÜRKÇE MEAL metninden HARFİ HARFİNE kopyalanmış 1-6 kelimelik kısa parça (kendi cümleni yazma, kelimeleri değiştirme).
- "parcalar[].not": en fazla 14 kelime, sade Türkçe açıklama; âlimler arasında tartışmalı bir yorumu kesinmiş gibi sunma.
- "kategori" yalnızca şunlardan biri: kisi, esma, kavram, duygu, hukum, mujde, mekan, benzetme. Ögesi olmayan kategoriyi hiç yazma. Aynı öge tek kategoride olsun.
- "kelimeler": numaralı HER Arapça kelime için "no", sözlük anlamı ("anlam", 1-3 kelime), biliyorsan üç harfli kök ("kok", ör. "ح م د"; emin değilsen "") ve uygunsa "kategori" (yoksa ""). Harf-i cer/edatların da anlamını yaz.
- "akis": ayetin anlam akışı 2-5 kısa adım (her biri en fazla 6 kelime).
- "oz": ayetin özü, tek cümle (en fazla 20 kelime).
- "hayat": bugüne dair tek, ölçülü ve somut uygulama cümlesi (abartı ya da vaat yok).
- Uydurma bilgi verme. Sadece JSON döndür.

JSON ŞEMASI:
{"oz":"","etiketler":[{"kategori":"kisi","ad":"","parcalar":[{"metin":"","not":""}]}],"kelimeler":[{"no":1,"anlam":"","kok":"","kategori":""}],"akis":[""],"hayat":""}`;
                try {
                    const ham = await GeminiAPI.generateJSON(prompt);
                    const temiz = {
                        oz: String(ham.oz || '').trim(),
                        hayat: String(ham.hayat || '').trim(),
                        akis: Array.isArray(ham.akis) ? ham.akis.map(x => String(x || '').trim()).filter(Boolean).slice(0, 6) : [],
                        etiketler: (Array.isArray(ham.etiketler) ? ham.etiketler : [])
                            .filter(e => e && ANATOMI_KAT_MAP[e.kategori] && String(e.ad || '').trim())
                            .map(e => ({ kategori: e.kategori, ad: String(e.ad).trim(), parcalar: (Array.isArray(e.parcalar) ? e.parcalar : []).filter(p => p && String(p.metin || '').trim()).map(p => ({ metin: String(p.metin).trim(), not: String(p.not || '').trim() })).slice(0, 6) })),
                        kelimeler: (Array.isArray(ham.kelimeler) ? ham.kelimeler : [])
                            .filter(k => k && Number(k.no) >= 1 && Number(k.no) <= kelimeler.length)
                            .map(k => ({ no: Number(k.no), anlam: String(k.anlam || '').trim(), kok: String(k.kok || '').trim(), kategori: ANATOMI_KAT_MAP[k.kategori] ? k.kategori : '' })),
                    };
                    if (!temiz.etiketler.length && !temiz.kelimeler.length) throw new Error('Ayet çözümlemesi boş döndü. Lütfen tekrar dene.');
                    setData(temiz);
                    try { localStorage.setItem(cacheKey, JSON.stringify(temiz)); } catch (e) {}
                } catch (e) {
                    setHata(e.message || 'Bir sorun oluştu.');
                } finally { setYukleniyor(false); }
            };
            React.useEffect(() => { getir(false); }, []);
            React.useEffect(() => {
                const esc = (e) => { if (e.key === 'Escape') onKapat(); };
                window.addEventListener('keydown', esc);
                const eski = document.body.style.overflow; document.body.style.overflow = 'hidden';
                return () => { window.removeEventListener('keydown', esc); document.body.style.overflow = eski; };
            }, []);

            const etiketler = (data && data.etiketler) || [];
            const kelimeBilgi = React.useMemo(() => { const m = {}; ((data && data.kelimeler) || []).forEach(k => { m[k.no - 1] = k; }); return m; }, [data]);
            const mevcutKat = ANATOMI_KAT.filter(c => etiketler.some(e => e.kategori === c.k));
            const gorunen = etiketler.map((e, ei) => ({ ...e, ei })).filter(e => aktifKat === 'hepsi' || e.kategori === aktifKat);

            // Meal üzerinde işaretlenecek aralıklar
            const araliklar = React.useMemo(() => {
                const r = [];
                gorunen.forEach(e => e.parcalar.forEach((p, pi) => {
                    const a = anatomiAralik(trText, p.metin);
                    if (a) r.push({ s: a[0], e: a[1], renk: ANATOMI_KAT_MAP[e.kategori].renk, ei: e.ei, pi });
                }));
                r.sort((x, y) => x.s - y.s || (y.e - y.s) - (x.e - x.s));
                const temiz = []; let son = -1;
                r.forEach(x => { if (x.s >= son) { temiz.push(x); son = x.e; } });
                return temiz;
            }, [data, aktifKat, trText]);

            const parcaSec = (ei, pi) => {
                setAktifParca(aktifParca && aktifParca.ei === ei && aktifParca.pi === pi ? null : { ei, pi });
                try { heroRef.current && heroRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
            };

            const mealParcalari = () => {
                const out = []; let i = 0;
                araliklar.forEach((x, k) => {
                    if (x.s > i) out.push(<span key={'t' + k}>{trText.slice(i, x.s)}</span>);
                    const aktif = aktifParca && aktifParca.ei === x.ei && aktifParca.pi === x.pi;
                    out.push(
                        <mark key={'m' + k} onClick={() => parcaSec(x.ei, x.pi)} className="cursor-pointer rounded-[4px] px-0.5 transition-all"
                            style={{ background: anatomiAlfa(x.renk, aktif ? 0.42 : 0.2), color: 'inherit', boxShadow: `inset 0 -2px 0 ${x.renk}`, outline: aktif ? `2px solid ${x.renk}` : 'none' }}>
                            {trText.slice(x.s, x.e)}
                        </mark>
                    );
                    i = x.e;
                });
                if (i < trText.length) out.push(<span key="son">{trText.slice(i)}</span>);
                return out;
            };

            const secilen = aktifParca ? etiketler[aktifParca.ei] : null;
            const secilenParca = secilen ? secilen.parcalar[aktifParca.pi] : null;
            const secKelime = aktifKelime !== null ? kelimeBilgi[aktifKelime] : null;

        const SurahDetail = ({ surah, setView, handleAiRequest, handleImageRequest, setShowSettings, playingAyah, toggleAudio, toggleFavorite, favorites, annotations, setAnnotation, fontSize, arabicFont, mealFont, mealColor, lastRead, setLastRead, setPrevRead, highlightedSearch, setJumpModalOpen, mealSource, reciterSource, showToast }) => {

            // --- işaretleme (fosforlu/altını çiz/üstünü çiz) + not ---
            const KALEM_RENKLERI = [
                { ad: 'Sarı', hex: '#fde047' }, { ad: 'Yeşil', hex: '#34d399' },

            const isaretStili = (ann) => {
                if (!ann || !ann.stil) return {};
                const c = ann.renk || '#fde047';
                if (ann.stil === 'highlight') return { background: `linear-gradient(transparent 8%, ${c}44 8%, ${c}44 92%, transparent 92%)`, borderRadius: '3px', boxDecorationBreak: 'clone', WebkitBoxDecorationBreak: 'clone', padding: '0 2px' };
                if (ann.stil === 'underline') return { textDecoration: 'underline', textDecorationColor: c, textDecorationThickness: '3px', textUnderlineOffset: '5px' };
                if (ann.stil === 'strike') return { textDecoration: 'line-through', textDecorationColor: c, textDecorationThickness: '2px', textDecorationSkipInk: 'none' };
                return {};
            };
            const isaretGuncelle = (ayah, trText, patch) => {
                const uid = `${surah.number}:${ayah.numberInSurah}`;

                setAnnotation(uid, yeni);

                if (!sessionStorage.getItem('jumpToAyah')) {

                setDetailLoading(true);
                
                const fetchSurahData = async () => {
                    try {
                        let arRes = await fetch(`https://api.alquran.cloud/v1/surah/${surah.number}/${reciterSource}`);
                        if (!arRes.ok) arRes = await fetch(`https://api.alquran.cloud/v1/surah/${surah.number}/ar.alafasy`);

        const Favorites = ({ favorites, toggleFavorite, clearAllFavorites, surahs, setCurrentSurah, setView, showToast, mealSource }) => {
            React.useEffect(() => { window.scrollTo(0, 0); }, []);
            const [ara, setAra] = React.useState('');
            const [temizleOnay, setTemizleOnay] = React.useState(false);
            const [ayetler, setAyetler] = React.useState({}); // uid -> {ar, tr}

            const duz = (t) => { try { return (window.ZIRVE && window.ZIRVE.duzMetin) ? window.ZIRVE.duzMetin(t) : t; } catch(e){ return t; } };
            // Arapça tespiti (fav.text yanlış slotta olabilir)
            const arapcaMi = (s) => /[\u0600-\u06FF]/.test(s || '');
            const veri = (fav) => {
                const c = ayetler[fav.uid];
                if (c && (c.ar || c.tr)) return c;
                // önbellek yoksa: kayıttan mantıklı tahmin
                let ar = fav.arabic || (arapcaMi(fav.text) ? fav.text : '');
                let tr = arapcaMi(fav.text) ? '' : (fav.text || '');
                return { ar, tr };
            };

            // Mount'ta her favorinin Arapça + Türkçesini taze çek (eski favoriler de tam olsun)
            React.useEffect(() => {
                let iptal = false;
                (async () => {
                    const yeni = {};
                    await Promise.all(favorites.map(async (fav) => {
                        try {
                            const [arR, trR] = await Promise.all([
                                fetch(`https://api.alquran.cloud/v1/ayah/${fav.surahNo}:${fav.ayahNo}/quran-uthmani`),
                                fetch(`https://api.alquran.cloud/v1/ayah/${fav.surahNo}:${fav.ayahNo}/${mealSource || 'tr.diyanet'}`)
                            ]);
                            const arJ = await arR.json(); const trJ = await trR.json();
                            const ar = (arJ && arJ.data && arJ.data.text) ? arJ.data.text : (fav.arabic || (arapcaMi(fav.text) ? fav.text : ''));
                            const tr = (trJ && trJ.data && trJ.data.text) ? trJ.data.text : (arapcaMi(fav.text) ? '' : (fav.text || ''));
                            yeni[fav.uid] = { ar, tr };
                        } catch(e) {
                            yeni[fav.uid] = { ar: fav.arabic || (arapcaMi(fav.text) ? fav.text : ''), tr: arapcaMi(fav.text) ? '' : (fav.text || '') };
                        }
                    }));
                    if (!iptal) setAyetler(yeni);
                })();
                return () => { iptal = true; };
            }, [favorites, mealSource]);

            const metinYap = (fav) => { const d = veri(fav); return `${d.ar ? d.ar + '\n\n' : ''}${d.tr ? '"' + duz(d.tr) + '"\n' : ''}— ${fav.surahName}, ${fav.ayahNo}. Ayet`; };
            const favHtml = (fav) => {
                const d = veri(fav);
                const ar = d.ar ? `<div style="direction:rtl;text-align:right;font-family:'Amiri','Traditional Arabic',serif;font-size:1.75em;line-height:2.2;color:#34d399;margin-bottom:16px">${d.ar}</div>` : '';
                const tr = d.tr ? `<div style="font-size:1.05em;line-height:1.75;color:#e7ecf3">"${duz(d.tr)}"</div>` : '';
                const ref = `<div style="margin-top:14px;color:#a7f3d0;font-weight:800;font-size:.95em">— ${fav.surahName}, ${fav.ayahNo}. Ayet</div>`;
                return ar + tr + ref;
            };

            const kopyala = (fav) => {
                const m = metinYap(fav);
                try { navigator.clipboard.writeText(m); showToast && showToast("📋 Ayet (Arapça + Türkçe) kopyalandı"); }
                catch(e){ showToast && showToast("Kopyalanamadı"); }
            };
            const paylas = async (fav) => {
                const m = metinYap(fav);
                try { if (navigator.share) { await navigator.share({ title: `${fav.surahName}, ${fav.ayahNo}. Ayet`, text: m }); } else { navigator.clipboard.writeText(m); showToast && showToast("📋 Paylaşım metni kopyalandı"); } }
                catch(e){}
            };
            const gorselFav = (fav) => { try { if (window.ZIRVE_gorselPaylas) window.ZIRVE_gorselPaylas({ html: favHtml(fav), baslik: `${fav.surahName}, ${fav.ayahNo}. Ayet` }); else showToast && showToast("Görsel modülü yüklenemedi"); } catch(e){} };
            const pdfFav = (fav) => { try { if (window.ZIRVE_pdfPaylas) window.ZIRVE_pdfPaylas({ html: favHtml(fav), baslik: `${fav.surahName}, ${fav.ayahNo}. Ayet` }); else showToast && showToast("PDF modülü yüklenemedi"); } catch(e){} };
            const tumunuPdf = () => {
                try {
                    if (!window.ZIRVE_pdfPaylas) { showToast && showToast("PDF modülü yüklenemedi"); return; }
                    const govde = favorites.map(fav => {
                        const d = veri(fav);
                        const ar = d.ar ? `<div style="direction:rtl;text-align:right;font-family:'Amiri','Traditional Arabic',serif;font-size:1.6em;line-height:2.1;color:#34d399;margin-bottom:10px">${d.ar}</div>` : '';
                        const tr = d.tr ? `<div style="font-size:1.02em;line-height:1.7;color:#e7ecf3">"${duz(d.tr)}"</div>` : '';
                        const ref = `<div style="margin-top:8px;color:#a7f3d0;font-weight:800;font-size:.9em">— ${fav.surahName}, ${fav.ayahNo}. Ayet</div>`;
                        return `<div style="padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)">${ar}${tr}${ref}</div>`;
                    }).join('');
                    window.ZIRVE_pdfPaylas({ html: govde, baslik: `Favori Ayetlerim (${favorites.length})`, dosyaAdi: 'favori-ayetlerim' });
                } catch(e){}
            };
            const git = (fav) => {
                const s = surahs.find(x => x.number === fav.surahNo);
                if (s) { setCurrentSurah(s); setView('surah'); sessionStorage.setItem('jumpToAyah', fav.ayahNo); }
            };

            const q = ara.trim().toLocaleLowerCase('tr');
            const kaynak = [...favorites].reverse(); // en son eklenen en üstte
            const liste = q
                ? kaynak.filter(f => (f.surahName + ' ' + f.text + ' ' + f.ayahNo).toLocaleLowerCase('tr').includes(q))
                : kaynak;

            return (
                <div className="min-h-screen pb-24 p-5 pt-10 max-w-2xl lg:max-w-5xl mx-auto zs-ust" style={{ "--zs-ust": "2.5rem" }}>

                            <span className="w-9 h-9 rounded-xl bg-gradient-to-br from-rose-500 to-pink-600 flex items-center justify-center shadow-lg shadow-rose-500/25"><Icons.Heart size={18} className="text-white" fill="currentColor"/></span>
                            Favorilerim
                        </h2>
                        {favorites.length > 0 && <span className="text-xs font-bold text-rose-300 bg-rose-500/10 border border-rose-500/25 rounded-full px-3 py-1">{favorites.length} ayet</span>}

                    <p className="text-xs text-slate-400 mb-5">Kalbine dokunan ayetleri burada topla; dokununca ayete git, kopyala, paylaş ya da kaldır. Kopyala/Görsel/PDF <b className="text-emerald-300/90">Arapça + Türkçe</b> birlikte verir.</p>

                                <Icons.Heart size={34} className="text-rose-500/70"/>
                            </div>
                            <p className="text-slate-300 font-semibold">Henüz favori ayetin yok</p>
                            <p className="text-slate-500 text-sm mt-1.5 max-w-xs mx-auto leading-relaxed">Bir sure okurken ayetin yanındaki <Icons.Heart size={13} className="inline text-rose-500 -mt-0.5" /> simgesine dokunarak favorilerine ekleyebilirsin.</p>
                            <button onClick={() => setView('home')} className="mt-6 bg-gradient-to-r from-emerald-600 to-teal-600 text-white text-sm font-bold px-6 py-3 rounded-xl shadow-lg shadow-emerald-500/20 hover:brightness-110 transition-all">Kur'an'ı Aç</button>
                        </div>
                    ) : (
                        <>
                            {favorites.length > 4 && (
                                <div className="relative mb-4">
                                    <Icons.Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
                                    <input value={ara} onChange={(e) => setAra(e.target.value)} placeholder="Favorilerde ara (sure adı veya metin)…" className="w-full pl-9 pr-3 py-2.5 rounded-xl bg-black/30 border border-slate-700 text-sm text-white focus:border-rose-500/60 outline-none" />

                                {liste.map((fav, i) => (
                                    <div key={fav.uid || i} className="group relative rounded-2xl bg-gradient-to-br from-slate-900 to-slate-900/60 border border-slate-800 hover:border-rose-500/40 transition-all shadow-lg overflow-hidden animate-fade-in">
                                        <div className="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-rose-500 to-pink-600"></div>
                                        <div className="p-4 pl-5 cursor-pointer" onClick={() => git(fav)}>
                                            <div className="flex justify-between items-start gap-3 mb-2">

                                                <button onClick={(e) => { e.stopPropagation(); toggleFavorite({ numberInSurah: fav.ayahNo, text: fav.text }, { number: fav.surahNo }); }} className="text-slate-500 hover:text-rose-500 hover:bg-rose-500/10 rounded-lg p-1 -mt-1 -mr-1 transition-colors shrink-0" title="Favorilerden kaldır"><Icons.X size={16}/></button>
                                            </div>
                                            {veri(fav).ar && <p className="text-right text-emerald-400 leading-loose mb-2" dir="rtl" style={{ fontSize: '1.3rem', fontFamily: "'Amiri','Traditional Arabic',serif" }}>{veri(fav).ar}</p>}
                                            <p className="text-[15px] opacity-90 leading-relaxed text-white">"{veri(fav).tr || fav.text}"</p>
                                        </div>

            const [searchQuery, setSearchQuery] = React.useState('');
            const [searchResults, setSearchResults] = React.useState([]);
            const [searchCount, setSearchCount] = React.useState(0);
            const [isSearching, setIsSearching] = React.useState(false);
            
            const [darkMode, setDarkMode] = React.useState(() => { try { return localStorage.getItem('zirve_oled') !== '1'; } catch(e){ return true; } });

            const [geminiKey, setGeminiKey] = React.useState('');

            const [fontSize, setFontSize] = React.useState(() => { try { const v = parseInt(localStorage.getItem('zirve_yazi_boyu'), 10); return (v >= 14 && v <= 40) ? v : 22; } catch(e){ return 22; } });
            React.useEffect(() => { try { localStorage.setItem('zirve_yazi_boyu', String(fontSize)); } catch(e){} }, [fontSize]);
            const [mealSource, setMealSource] = React.useState('tr.yazir');
            const [reciterSource, setReciterSource] = React.useState('ar.abdulbasitmurattal');
            const [arabicFont, setArabicFont] = React.useState('font-amiri'); 
            const [mealFont, setMealFont] = React.useState('');
            const [mealColor, setMealColor] = React.useState('');

            const [lastRead, setLastRead] = React.useState(null);
            const [prevRead, setPrevRead] = React.useState(null);
            // Bildirime dokununca ilgili bölüm açılsın: #kaldigim · #hatim · #favoriler · #notlar · #anasayfa · #sure-18 (· #sure-2-255)

            React.useEffect(() => {

                let m = null;

                else return;

            }, [hashTik, surahs, lastRead]);
            const [jumpModalOpen, setJumpModalOpen] = React.useState(false);
            
            const [hatimProgress, setHatimProgress] = React.useState(Array(30).fill(false));
            
            const [aiModalOpen, setAiModalOpen] = React.useState(false);

            const [aiImageModalOpen, setAiImageModalOpen] = React.useState(false);
            const [aiImageUrl, setAiImageUrl] = React.useState('');
            const [aiImageLoading, setAiImageLoading] = React.useState(false);
            const [aiImageError, setAiImageError] = React.useState(null);
            
            const [isTtsPlaying, setIsTtsPlaying] = React.useState(false);

            React.useEffect(() => {

                    body.classList.add('bg-black'); 
                }
            }, [darkMode]);

            const performDeepSearch = React.useCallback(async (query) => {
                if (query.length < 2) { setSearchResults([]); setSearchCount(0); return; }
                setIsSearching(true);
                setSearchResults([]); 
                setSearchCount(0);
                try {
                    const res = await fetch(`https://api.alquran.cloud/v1/search/${query}/all/${mealSource}`);
                    const data = await res.json();
                    
                    if (data.code === 200 && data.data && data.data.matches) {
                        setSearchResults(data.data.matches);
                        setSearchCount(data.data.count || data.data.matches.length);
                    } else {
                        setSearchResults([]);
                        setSearchCount(0);
                    }
                } catch (e) {

                    setSearchResults([]);
                    setSearchCount(0);
                }
                finally { setIsSearching(false); }
            }, [mealSource]);

            React.useEffect(() => {
                const timer = setTimeout(() => {
                    if (searchQuery.length > 2) {

                    }
                }, 500); 
                
                return () => clearTimeout(timer);

            React.useEffect(() => {

                const savedHatim = localStorage.getItem('hatim_progress');
                if(savedHatim) setHatimProgress(JSON.parse(savedHatim));
                
                const localFavs = localStorage.getItem('favs');
                if(localFavs) setFavorites(JSON.parse(localFavs));

                const localNotlar = localStorage.getItem('zirve_notlar');
                if(localNotlar) { try { setAnnotations(JSON.parse(localNotlar) || {}); } catch(e){} }

                const initAuth = async () => {
                    if (isFirebaseAvailable) {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await auth.signInWithCustomToken(__initial_auth_token);
                            else await auth.signInAnonymously();
                        } catch(e) { console.error("Auth", e); }
                    }
                };
                initAuth();
                if (isFirebaseAvailable) {
                    firebase.auth().onAuthStateChanged((currentUser) => {
                        setUser(currentUser);
                        if (currentUser) {

                            .onSnapshot((docSnap) => { if (docSnap.exists) setFavorites(docSnap.data().list || []); }, (err) => {});
                             db.collection('artifacts').doc(appId).collection('users').doc(currentUser.uid).collection('annotations').doc('main')
                            .onSnapshot((docSnap) => { if (docSnap.exists) setAnnotations(docSnap.data().map || {}); }, (err) => {});
                        }
                    });
                }
                fetch('https://api.alquran.cloud/v1/surah').then(res => res.json()).then(data => { setSurahs(data.data); setLoading(false); });
            }, []);

                    audio.play().catch(e => console.error("Audio Error", e));
                } else { audio.pause(); }
                return () => { audio.removeEventListener('ended', handleEnded); audio.pause(); };
            }, [playingAyah]);

                    newFavs = newFavs.filter(f => f.uid !== favItem.uid);

                    newFavs.push(favItem);

                    try {

                try {

                        setAiConv(prev => { const k = [...prev]; for (let i = k.length - 1; i >= 0; i--) { if (k[i].role === 'ai') { k[i] = { role: 'ai', text: kismi }; break; } } return k; });
                        setAiContent(kismi);

                    setAiConv(prev => { const k = [...prev]; for (let i = k.length - 1; i >= 0; i--) { if (k[i].role === 'ai') { k[i] = { role: 'ai', text: sonuc }; break; } } return k; });
                    setAiContent(sonuc);

                    setAiConv(prev => { const k = [...prev]; for (let i = k.length - 1; i >= 0; i--) { if (k[i].role === 'ai') { k[i] = { role: 'ai', text: '⚠️ Cevap alınamadı: ' + err.message }; break; } } return k; });
                }

            const handleImageRequest = async (ayahText) => {

                        setFontSize={setFontSize} 
                        mealSource={mealSource}
                        setMealSource={setMealSource}
                        reciterSource={reciterSource}
                        setReciterSource={setReciterSource}
                        arabicFont={arabicFont}
                        setArabicFont={setArabicFont}
                        mealFont={mealFont}

        // 🛟 Beyaz ekran olmasın: React hatası tüm uygulamayı düşürmez
        class ZirveHataSiniri extends React.Component {
            constructor(p) { super(p); this.state = { hata: null }; }

                    <div role="alert" className="min-h-[100dvh] flex items-center justify-center p-5 bg-[#0b1220]">

                            <button onClick={() => E.temizleYenile ? E.temizleYenile() : location.reload()} className="w-full min-h-[48px] rounded-2xl bg-slate-800 border border-slate-700 text-slate-200 font-bold">🧹 Önbelleği temizleyip yenile</button>
                        </div>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ZirveHataSiniri><KuranSiyerApp /></ZirveHataSiniri>);
