    <!-- ===== ZİRVE API KATMANI (Kuran & Siyer) · sayısız anahtar + otomatik model + kota geçişi ===== -->
<script>
(function(){
  "use strict";
  const LS = { keys:'zirve_keys', model:'geminiModel', legacy:'geminiApiKey', models:'zirve_models' };

  // ---- GÖMÜLÜ ANAHTARLAR (opsiyonel) ----
  // Buraya anahtar yapıştırırsan, dosyayı YENİ bir projeye kopyaladığında anahtarlar da gelir
  // (cihazda localStorage boşsa bunlar otomatik yüklenir). Her anahtar tırnak içinde, virgülle ayrılır.
  // Örnek:
  //   const GOMULU_ANAHTARLAR = [ "AIza...birinci", "AIza...ikinci" ];
  const GOMULU_ANAHTARLAR = [
    // "AIza...",
  ];

  // ---- Anahtar halkası (RING): sayısız anahtar ----
  const RING = { keys:[], i:0, cool:{} };  // cool[key] = {bitis: ts, gunluk: ts}
  function ringLoad(){
    let arr=[];
    try{ const r=localStorage.getItem(LS.keys); if(r){ const d=JSON.parse(r); if(Array.isArray(d)) arr=d; } }catch(e){}
    // eski tek-anahtar sistemi varsa RING'e taşı
    const eski=(localStorage.getItem(LS.legacy)||'').trim();
    if(eski && arr.indexOf(eski)===-1) arr.unshift(eski);
    RING.keys = arr.map(k=>String(k||'').trim()).filter(k=>k.length>=8);
    // localStorage boşsa gömülü anahtarları kullan (yeni projeye taşındığında da çalışsın)
    if(!RING.keys.length && GOMULU_ANAHTARLAR && GOMULU_ANAHTARLAR.length){
      RING.keys = GOMULU_ANAHTARLAR.map(k=>String(k||'').trim()).filter(k=>k.length>=8);
      if(RING.keys.length){ try{ localStorage.setItem(LS.keys, JSON.stringify(RING.keys)); }catch(e){} }
    }
    // uygulamanın okuduğu tek-anahtar alanını da ilk anahtara sabitle (uyumluluk)
    if(RING.keys.length){ try{ localStorage.setItem(LS.legacy, RING.keys[0]); }catch(e){} }
  }
  function ringSave(){
    try{ localStorage.setItem(LS.keys, JSON.stringify(RING.keys)); }catch(e){}
    if(RING.keys.length){ try{ localStorage.setItem(LS.legacy, RING.keys[0]); }catch(e){} }
  }
  function ringSet(text){
    const arr=String(text||'').split(/[\s,;\n]+/).map(k=>k.trim()).filter(k=>k.length>=8);
    RING.keys=[...new Set(arr)]; RING.i=0; RING.cool={}; ringSave();
  }
  function simdi(){ return Date.now(); }
  function keyHazirMi(k){
    const c=RING.cool[k]; if(!c) return true;
    const t=simdi();
    if(c.gunluk && c.gunluk>t) return false;
    if(c.bitis && c.bitis>t) return false;
    return true;
  }
  function aktifKey(){
    if(!RING.keys.length) return '';
    for(let n=0;n<RING.keys.length;n++){
      const idx=(RING.i+n)%RING.keys.length;
      if(keyHazirMi(RING.keys[idx])){ RING.i=idx; return RING.keys[idx]; }
    }
    // hepsi soğumada → en erken açılacakı seç
    return RING.keys[RING.i%RING.keys.length];
  }
  function keySonraki(k, sebep){
    if(!RING.cool[k]) RING.cool[k]={};
    if(sebep==='gunluk') RING.cool[k].gunluk=simdi()+1000*60*60*6;   // 6 saat
    else RING.cool[k].bitis=simdi()+1000*65;                         // 65 sn
    RING.i=(RING.i+1)%Math.max(1,RING.keys.length);
  }

  // ---- Model havuzu + otomatik seçim ----
  const OLU = ['gemini-2.0-flash','gemini-2.0-flash-lite','gemini-1.5-flash','gemini-1.5-pro','gemini-pro','gemini-2.5-flash-preview-09-2025'];
  const MODEL_TERCIH = ['gemini-2.5-flash','gemini-flash-latest','gemini-2.5-flash-lite','gemini-flash-lite-latest','gemini-2.5-pro','gemini-pro-latest'];
  let MODEL = localStorage.getItem(LS.model) || 'gemini-2.5-flash';
  if(OLU.indexOf(MODEL)!==-1){ MODEL='gemini-2.5-flash'; try{ localStorage.setItem(LS.model, MODEL); }catch(e){} }
  let KULLANILABILIR=[];
  try{ const r=localStorage.getItem(LS.models); if(r) KULLANILABILIR=JSON.parse(r)||[]; }catch(e){}
  function modelHavuzu(){
    if(!KULLANILABILIR.length) return MODEL_TERCIH.slice();
    const h=MODEL_TERCIH.filter(m=>KULLANILABILIR.indexOf(m)!==-1);
    return h.length?h:MODEL_TERCIH.slice();
  }
  function modelSonraki(simdiki, denenen){
    return modelHavuzu().find(m=>m!==simdiki && denenen.indexOf(m)===-1) || null;
  }
  function enIyiModel(list){
    for(const m of MODEL_TERCIH) if(list.indexOf(m)!==-1) return m;
    return list[0]||MODEL;
  }
  // Canlı keşfedilen görsel modelleri (Google'dan öğrenilir; elle liste tutmaya gerek yok)
  let GORSEL_MODELLER = [];
  async function listModels(key){
    try{
      const r=await _fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
      if(!r.ok) return [];
      const d=await r.json();
      const hepsi = (d.models||[]);
      // Görsel üretebilen modelleri de canlı yakala (adında -image geçen veya IMAGE modalitesi olanlar)
      const gorsel = hepsi.filter(m=>{
        const ad=(m.name||'').toLowerCase();
        const mod=(m.supportedGenerationMethods||[]);
        const cikti=(m.outputModalities||m.supportedOutputModalities||[]).join(',').toLowerCase();
        return (ad.indexOf('-image')!==-1 || cikti.indexOf('image')!==-1) && mod.indexOf('generateContent')!==-1;
      }).map(m=>(m.name||'').replace('models/','')).filter(Boolean);
      if(gorsel.length){
        // en yeniyi öne al (3.x > 2.5), lite'ı hız için öne çıkar
        gorsel.sort((a,b)=>{
          const p=x=>{ let s=0; if(/gemini-3/.test(x))s+=100; else if(/gemini-2\.5/.test(x))s+=50; if(/lite/.test(x))s+=5; return s; };
          return p(b)-p(a);
        });
        GORSEL_MODELLER = gorsel;
        try{ localStorage.setItem('zirve_gorsel_modeller', JSON.stringify(gorsel)); }catch(e){}
      }
      // metin (generateContent) modelleri
      return hepsi.filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')!==-1)
        .map(m=>(m.name||'').replace('models/','')).filter(Boolean);
    }catch(e){ return []; }
  }
  // sayfa açılışında kayıtlı görsel listeyi yükle
  try{ const gr=localStorage.getItem('zirve_gorsel_modeller'); if(gr){ const gd=JSON.parse(gr); if(Array.isArray(gd)&&gd.length) GORSEL_MODELLER=gd; } }catch(e){}

  function googleHata(msg){
    const m=(msg||'').toLowerCase();
    if(/quota|exhausted|per day|perday|günlük|gunluk/i.test(m)) return 'gunluk';
    if(/rate|429|too many|dakika/i.test(m)) return 'dakika';
    if(/not found|is not supported|unknown name.*model|models\//i.test(m)) return 'model';
    return 'diger';
  }

  // ---- Orijinal fetch ----
  const _fetch = window.fetch.bind(window);

  function toast(msg,renk){
    try{
      let t=document.getElementById('zirve-toast');
      if(!t){ t=document.createElement('div'); t.id='zirve-toast';
        t.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:2147483000;background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font:600 13px system-ui;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center;transition:opacity .3s';
        document.body.appendChild(t); }
      t.innerHTML=msg; t.style.background = renk==='red'?'#7f1d1d':renk==='green'?'#14532d':'#0f172a';
      t.style.opacity='1'; clearTimeout(t._h); t._h=setTimeout(()=>{ t.style.opacity='0'; },3200);
    }catch(e){}
  }

  // ---- HTML + Markdown → TEMİZ DÜZ METİN (Kopyala/Paylaş için) ----
  // AI cevapları renkli <span>, **kalın**, *italik*, ## başlık, > alıntı içerir;
  // WhatsApp'a yapıştırınca bunlar çirkin görünür. Bu fonksiyon hepsini temiz metne çevirir.
  function duzMetin(str){
    if(str==null) return '';
    var s = String(str);
    // 1) satır sonu üreten etiketleri koru
    s = s.replace(/<\s*br\s*\/?>/gi, '\n')
         .replace(/<\/\s*(p|div|h[1-6]|tr)\s*>/gi, '\n')
         .replace(/<\s*li[^>]*>/gi, '• ')
         .replace(/<\/\s*li\s*>/gi, '\n');
    // 2) kalan tüm HTML etiketlerini sil (span style vb.)
    s = s.replace(/<[^>]+>/g, '');
    // 3) HTML entity çöz (&amp; &lt; &nbsp; ...)
    try{ var ta=document.createElement('textarea'); ta.innerHTML=s; s=ta.value; }catch(e){}
    // 4) Markdown işaretlerini temizle
    s = s.replace(/^\s{0,3}#{1,6}\s*/gm, '')                 // ## başlık
         .replace(/\*\*([^*]+)\*\*/g, '$1')                  // **kalın**
         .replace(/\*([^*\n]+)\*/g, '$1')                    // *italik*
         .replace(/__([^_]+)__/g, '$1')                      // __kalın__
         .replace(/`{1,3}([^`]+?)`{1,3}/g, '$1')             // `kod`
         .replace(/^\s{0,3}>\s?/gm, '')                      // > alıntı
         .replace(/^\s*[-*+]\s+/gm, '• ')                    // - liste
         .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');           // [metin](link)
    // 5) fazla boşlukları sadeleştir
    s = s.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    return s;
  }

  // ---- fetch sarmalayıcı: sadece Gemini isteklerini yönet ----
  window.fetch = async function(url, opt){
    try{
      const u = (typeof url==='string') ? url : (url && url.url) || '';
      if(u.indexOf('generativelanguage.googleapis.com')===-1 || u.indexOf(':generateContent')===-1 && u.indexOf(':predict')===-1 && u.indexOf(':streamGenerateContent')===-1){
        return _fetch(url, opt);   // Gemini üretim isteği değil → dokunma
      }
      if(!RING.keys.length) return _fetch(url, opt);  // anahtar yoksa eski akış

      // modeli ve keyi URL'den ayıkla
      const mMatch = u.match(/models\/([^:]+):/);
      let istekModeli = mMatch ? mMatch[1] : MODEL;
      const denenenModeller=[];
      const denenenKeys=[];

      for(let tur=0; tur<Math.max(6, RING.keys.length*2); tur++){
        const key = aktifKey();
        if(!key) break;
        // URL'yi güncel key + güncel model ile yeniden kur
        let yeniUrl = u.replace(/([?&])key=[^&]*/,'$1key='+encodeURIComponent(key));
        if(yeniUrl.indexOf('key=')===-1) yeniUrl += (yeniUrl.indexOf('?')===-1?'?':'&')+'key='+encodeURIComponent(key);
        // görsel/tts modelini değiştirme; sadece generateContent metin modelini oto-seç
        const gorselMi = /imagen|-image|:predict|tts/i.test(u);
        if(!gorselMi && istekModeli!==MODEL && denenenModeller.indexOf(MODEL)===-1){
          yeniUrl = yeniUrl.replace(/models\/[^:]+:/, 'models/'+MODEL+':');
          istekModeli = MODEL;
        }

        let r;
        try{ r = await _fetch(yeniUrl, opt); }
        catch(agHata){
          // ağ hatası → kısa bekle, tekrar dene
          if(tur < 3){ await new Promise(x=>setTimeout(x,800)); continue; }
          throw agHata;
        }

        if(r.ok) return r;

        // hata analizi (gövdeyi klonlayıp oku)
        let hataMsg='';
        try{ const c=r.clone(); const j=await c.json(); hataMsg=(j.error&&j.error.message)||''; }catch(e){}
        const tip=googleHata(hataMsg || ('http '+r.status));

        if(r.status===429 || tip==='gunluk' || tip==='dakika'){
          keySonraki(key, tip==='gunluk'?'gunluk':'dakika');
          denenenKeys.push(key);
          toast('🔑 Bir anahtarın kotası doldu → sıradaki anahtara geçiliyor…','green');
          continue;
        }
        if((r.status===404 || r.status===400) && tip==='model' && !/imagen|-image|:predict|tts/i.test(u)){
          // modeli otomatik düzelt
          if(!KULLANILABILIR.length){
            const list=await listModels(key);
            if(list.length){ KULLANILABILIR=list; try{ localStorage.setItem(LS.models, JSON.stringify(list)); }catch(e){} }
          }
          const yeni = modelSonraki(MODEL, denenenModeller) || enIyiModel(KULLANILABILIR);
          denenenModeller.push(MODEL);
          if(yeni && yeni!==MODEL){
            MODEL=yeni; try{ localStorage.setItem(LS.model, yeni); }catch(e){}
            toast('🔧 Model uyarlandı → <b>'+yeni+'</b>','green');
            continue;
          }
        }
        if(r.status===503 || r.status===500 || r.status===502 || r.status===504){
          await new Promise(x=>setTimeout(x, 1200));
          // birkaç kez modeli de değiştirerek dene
          const yeni = modelSonraki(MODEL, denenenModeller);
          if(yeni){ denenenModeller.push(MODEL); MODEL=yeni; try{ localStorage.setItem(LS.model, yeni); }catch(e){}
            toast('⏳ Yoğunluk var → <b>'+yeni+'</b> deneniyor…','#0f172a'); }
          continue;
        }
        // bilinmeyen hata → olduğu gibi döndür (uygulama kendi mesajını göstersin)
        return r;
      }
      // tüm turlar bitti → son bir kez normal dene
      return _fetch(url, opt);
    }catch(e){
      return _fetch(url, opt);
    }
  };

  // ---- Başlat: anahtarları yükle + otomatik model keşfi ----
  ringLoad();
  (async function otoKesif(){
    try{
      if(RING.keys.length && !KULLANILABILIR.length){
        const list=await listModels(RING.keys[0]);
        if(list.length){
          KULLANILABILIR=list; try{ localStorage.setItem(LS.models, JSON.stringify(list)); }catch(e){}
          if(list.indexOf(MODEL)===-1){ const iyi=enIyiModel(list); if(iyi){ MODEL=iyi; try{ localStorage.setItem(LS.model, iyi); }catch(e){} } }
        }
      }
    }catch(e){}
  })();

  // ---- Dışarı aç (panel için) ----
  window.ZIRVE = { RING, ringSet, ringLoad, ringSave, listModels, get model(){return MODEL;}, set model(v){MODEL=v; try{localStorage.setItem(LS.model,v);}catch(e){}}, KULLANILABILIR:()=>KULLANILABILIR, gorselModelleri:()=>GORSEL_MODELLER, modelHavuzu, toast, duzMetin };

  // ---- İnternet kesildi uyarısı ----
  try{
    window.addEventListener('offline', function(){ toast('📵 İnternet bağlantısı kesildi. Yapay zeka özellikleri çalışmaz.','red'); });
    window.addEventListener('online', function(){ toast('✅ İnternet geri geldi.','green'); });
  }catch(e){}

  // ---- "Yapay zeka hata yapabilir" kalıcı uyarı şeridi (alt köşe, kapatılabilir) ----
  function yapayZekaUyari(){
    try{
      if(localStorage.getItem('zirve_uyari_gizli')==='1') return;
      if(document.getElementById('zirve-ai-uyari')) return;
      if(!document.getElementById('zirve-ai-uyari-css')){
        var st=document.createElement('style'); st.id='zirve-ai-uyari-css';
        st.textContent='@keyframes zaiIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}'
          +'#zirve-ai-uyari{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:2147482000;width:calc(100% - 16px);max-width:600px;'
          +'display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:16px;color:#e2e8f0;'
          +'background:linear-gradient(135deg,rgba(16,185,129,.14),rgba(15,23,42,.96) 46%);'
          +'-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);'
          +'border:1px solid rgba(52,211,153,.32);box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.04);'
          +'font:600 11.5px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;animation:zaiIn .5s cubic-bezier(.2,.8,.2,1) both}'
          +'#zirve-ai-uyari .zai-ikon{flex:0 0 30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;'
          +'background:radial-gradient(circle at 32% 26%,rgba(251,191,36,.5),rgba(245,158,11,.15));box-shadow:0 4px 12px rgba(251,191,36,.28)}'
          +'#zirve-ai-uyari .zai-tx{flex:1}#zirve-ai-uyari .zai-tx b{color:#a7f3d0}'
          +'#zirve-ai-uyari .zai-ok{flex:0 0 auto;background:linear-gradient(90deg,#34d399,#10b981 60%,#0d9488);color:#04231a;border:none;'
          +'border-radius:10px;padding:7px 13px;font-weight:800;cursor:pointer;font-size:11.5px;box-shadow:0 5px 14px rgba(16,185,129,.32);transition:transform .12s,box-shadow .2s;-webkit-tap-highlight-color:transparent}'
          +'#zirve-ai-uyari .zai-ok:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(16,185,129,.45)}'
          +'@media (prefers-reduced-motion:reduce){#zirve-ai-uyari{animation:none}}';
        document.head.appendChild(st);
      }
      const b=document.createElement('div'); b.id='zirve-ai-uyari';
      b.innerHTML='<span class="zai-ikon">✨</span>'
        +'<span class="zai-tx">Bu içerikler <b>yapay zekâ</b> ile üretilir; nadiren hata olabilir. Önemli/dinî konularda güvenilir bir kaynağa danışın.</span>'
        +'<button class="zai-ok" id="zirve-uyari-kapat">Anladım</button>';
      document.body.appendChild(b);
      document.getElementById('zirve-uyari-kapat').onclick=function(){ try{localStorage.setItem('zirve_uyari_gizli','1');}catch(e){} b.remove(); };
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', ()=>setTimeout(yapayZekaUyari,1500));
  else setTimeout(yapayZekaUyari,1500);
})();
</script>

    <!-- ===== ZİRVE EKRAN / CİHAZ OTO-UYUM MODÜLÜ (çerçeveden bağımsız, saf JS+CSS) ===== -->
    <style>
      @media print { html { zoom: 1 !important; } }
      #zirve-ekran-pill{
        position:fixed; left:8px; bottom:120px; z-index:2147481500;
        display:flex; align-items:center; gap:4px;
        background:rgba(15,23,42,.72); color:#cbd5e1;
        border:1px solid rgba(148,163,184,.35); border-radius:999px;
        padding:4px 9px; font:600 11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
        opacity:.5; transition:opacity .2s; user-select:none; -webkit-tap-highlight-color:transparent;
      }
      #zirve-ekran-pill:hover, #zirve-ekran-pill:active{ opacity:.95; }
      #zirve-ekran-pill .zx{ background:transparent; border:none; color:#94a3b8; font-weight:900; font-size:14px; line-height:1; cursor:pointer; padding:0 2px; }
    </style>
    <script>
    (function(){
      "use strict";
      var LS_MOD='zirve_ekran_mod';        // manuel seçim ('' = otomatik)
      var LS_PILL='zirve_ekran_pill_gizli';
      var MODLAR=['auto','tablet','smartboard','largeboard'];
      var ETIKET={auto:'Otomatik', tablet:'Tablet', smartboard:'Akıllı Tahta', largeboard:'Büyük Ekran'};
      var CARP={auto:1, tablet:1, smartboard:1.35, largeboard:1.6};

      function otoTespit(){
        var w=Math.max(window.innerWidth||0, document.documentElement.clientWidth||0);
        var dpr=window.devicePixelRatio||1;
        var dokunmatik=('ontouchstart' in window)||(navigator.maxTouchPoints||0)>0;
        // telefon/tablet/laptop/masaüstü → 1 (dokunma). Büyük+dokunmatik+düşük DPR → akıllı tahta. Çok büyük/4K → büyük ekran.
        if(w>=2500) return 'largeboard';
        if(w>=1600 && dokunmatik && dpr<=1.5) return 'smartboard';
        return 'auto';
      }
      function seciliMod(){
        var m=''; try{ m=localStorage.getItem(LS_MOD)||''; }catch(e){}
        if(MODLAR.indexOf(m)===-1) m='';
        return m;
      }
      function etkinMod(){ var m=seciliMod(); return (m && m!=='auto') ? m : otoTespit(); }
      function uygula(){
        var z=CARP[etkinMod()]||1;
        try{ document.documentElement.style.zoom = (z===1 ? '' : String(z)); }catch(e){}
        pillYaziGuncelle();
      }
      // PDF/yazdırma için dışa aç
      window.ZIRVE_ekranReset=function(){ try{ document.documentElement.style.zoom=''; }catch(e){} };
      window.ZIRVE_ekranGeri=function(){ uygula(); };

      var pill=null, pillYazi=null;
      function pillYaziGuncelle(){
        if(!pillYazi) return;
        var m=seciliMod();
        pillYazi.textContent='📺 '+(m ? ETIKET[m] : (ETIKET[otoTespit()]+' (oto)'));
      }
      function pilYap(){
        try{ if(localStorage.getItem(LS_PILL)==='1') return; }catch(e){}
        if(document.getElementById('zirve-ekran-pill')) return;
        pill=document.createElement('div'); pill.id='zirve-ekran-pill';
        pillYazi=document.createElement('span'); pillYazi.style.cursor='pointer';
        var kapat=document.createElement('button'); kapat.className='zx'; kapat.textContent='×'; kapat.title='Gizle';
        pill.appendChild(pillYazi); pill.appendChild(kapat);
        document.body.appendChild(pill);
        pillYaziGuncelle();
        // dokun → modlar arası geç (Otomatik→Tablet→Akıllı Tahta→Büyük Ekran)
        pillYazi.addEventListener('click', function(){
          var idx=MODLAR.indexOf(seciliMod()||'auto');
          var yeni=MODLAR[(idx+1)%MODLAR.length];
          try{ localStorage.setItem(LS_MOD, yeni==='auto'?'':yeni); }catch(e){}
          uygula();
        });
        kapat.addEventListener('click', function(e){
          e.stopPropagation();
          try{ localStorage.setItem(LS_PILL,'1'); }catch(e){}
          if(pill){ pill.remove(); pill=null; }
        });
      }

      // ---- canlı göster/gizle + merkezi kontrol kaydı ----
      function ekranPillGoster(){ try{ localStorage.removeItem(LS_PILL); }catch(e){} pilYap(); }
      function ekranPillGizle(){ try{ localStorage.setItem(LS_PILL,'1'); }catch(e){} if(pill){ pill.remove(); pill=null; } }
      function ekranPillAcik(){ try{ return localStorage.getItem(LS_PILL)!=='1'; }catch(e){ return true; } }
      try{ (window.ZIRVE_kontroller=window.ZIRVE_kontroller||[]).push({ id:'ekran', etiket:'Ekran / Cihaz Modu', ikon:'📺', goster:ekranPillGoster, gizle:ekranPillGizle, acikMi:ekranPillAcik }); }catch(e){}

      // manuel seçim yoksa ekran boyutu değişince yeniden otomatik uygula
      var t=null;
      window.addEventListener('resize', function(){
        clearTimeout(t); t=setTimeout(function(){ if(!seciliMod()) uygula(); pillYaziGuncelle(); }, 200);
      });
      window.addEventListener('orientationchange', function(){ setTimeout(function(){ if(!seciliMod()) uygula(); }, 250); });

      function baslat(){ uygula(); pilYap(); }
      if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(baslat,400); });
      else setTimeout(baslat,400);
    })();
    </script>

    <script>

        baslik: "Kuran & Siyer Atlası'na Hoş Geldiniz",
        ozet: "Kur'an-ı Kerim'i meal ve sesli kıraatle oku; ayet ve sureleri yapay zekâ ile tefsir, siyer, tefekkür ve eğitim yönünden derinlemesine keşfet. Kalbe dokunan bir dijital Kur'an ve Siyer atlası.",

          { ikon:'💬', metin:"Bir ayete dokun; nüzul sebebi, tefsir, kelime analizi gibi yapay zekâ içeriklerini üret ya da &#39;Ayete Sor&#39; ile kendi sorunu sor." },
          { ikon:'🎨', metin:"Ana ekrandaki renkli kartlarla (Manevi Ayna, Siyer Zaman Yolculuğu, Tefekkür, Aile &amp; Eğitim Rehberi...) özel içerikler hazırlat." },
          { ikon:'🔑', vurgu:true, metin:"<b>Önce ⚙️ Ayarlar&#39;a gir</b> ve ücretsiz bir Google Gemini API anahtarı yapıştır. Yapay zekânın çalışması için gereklidir; nasıl alınacağı Ayarlar içinde adım adım anlatılıyor (tek seferlik, ücretsiz)." }
        ]
      };
      var LS='zirve_karsilama_goruldu';
      var LS_GIZLI='zirve_karsilama_gizli';
      var RENKLER=[
        'linear-gradient(135deg,#34d399,#059669)',
        'linear-gradient(135deg,#38bdf8,#0284c7)',
        'linear-gradient(135deg,#c084fc,#7c3aed)',
        'linear-gradient(135deg,#fb7185,#e11d48)'
      ];

      function kapat(){
        var o=document.getElementById('zirve-karsilama-ort'); if(o) o.remove();
        try{ localStorage.setItem(LS,'1'); }catch(e){}
      }
      function ac(){
        if(document.getElementById('zirve-karsilama-ort')) return;
        var adimHtml = (K.adimlar||[]).map(function(a,i){
          var metin = (typeof a==='string') ? a : (a.metin||'');
          var vurgu = (typeof a==='object') && a.vurgu;
          var ikon  = (typeof a==='object' && a.ikon) ? a.ikon : String(i+1);
          var bg    = vurgu ? 'linear-gradient(135deg,#fbbf24,#f59e0b)' : RENKLER[i%RENKLER.length];
          var renk  = vurgu ? '#3b2f0b' : '#04231a';
          return '<div class="zk-adim'+(vurgu?' zk-vurgu':'')+'">'
            +'<div class="zk-no" style="background:'+bg+';color:'+renk+'">'+ikon+'</div>'
            +'<div class="zk-tx">'+metin+'</div></div>';
        }).join('');
        var html='<div id="zirve-karsilama-kutu">'
          +'<div class="zk-hero"><div class="zk-ay">🌙</div><div class="zk-baslik">'+K.baslik+'</div></div>'

          +'<div class="zk-alt">Bu pencereyi istediğinde sol alttaki <b>?</b> düğmesinden tekrar açabilirsin.</div>'
          +'</div></div>';
        var ort=document.createElement('div'); ort.id='zirve-karsilama-ort'; ort.innerHTML=html;
        ort.addEventListener('click', function(e){ if(e.target===ort) kapat(); });
        document.body.appendChild(ort);

      }

        var x=document.createElement('button'); x.id='zirve-karsilama-x'; x.textContent='×'; x.title='Bu düğmeyi gizle';
        x.addEventListener('click', function(e){ e.stopPropagation(); try{ localStorage.setItem(LS_GIZLI,'1'); }catch(e){} sar.remove(); });
        sar.appendChild(b); sar.appendChild(x);
        document.body.appendChild(sar);
      }
      // ---- canlı göster/gizle + merkezi kontrol kaydı ----
      function yardimGoster(){ try{ localStorage.removeItem(LS_GIZLI); }catch(e){} dugmeYap(); }
      function yardimGizle(){ try{ localStorage.setItem(LS_GIZLI,'1'); }catch(e){} var s=document.getElementById('zirve-karsilama-sar'); if(s) s.remove(); }
      function yardimAcik(){ try{ return localStorage.getItem(LS_GIZLI)!=='1'; }catch(e){ return true; } }
      try{ (window.ZIRVE_kontroller=window.ZIRVE_kontroller||[]).push({ id:'yardim', etiket:'Yardım / Nasıl Kullanılır', ikon:'❓', goster:yardimGoster, gizle:yardimGizle, acikMi:yardimAcik }); }catch(e){}

      function baslat(){
        dugmeYap();
        var goruldu=false; try{ goruldu=localStorage.getItem(LS)==='1'; }catch(e){}
        if(!goruldu) setTimeout(ac, 700);
      }
      if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(baslat,500); });
      else setTimeout(baslat,500);
    })();

    <script>
    (function(){
      "use strict";
      // ---- PAYLAŞIM AYARI (opsiyonel): url boşsa sayfanın kendi adresi kullanılır ----
      var PAYLAS = { url:'', baslik:'' };
      var LIB = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
      var LS_GIZLI='zirve_qr_gizli';

      function toast(m,r){ try{ if(window.ZIRVE&&window.ZIRVE.toast) window.ZIRVE.toast(m,r); }catch(e){} }
      function paylasUrl(){
        var u=(PAYLAS.url||'').trim(); if(u) return u;
        try{ return String(window.location.href); }catch(e){ return ''; }
      }
      function yerelMi(u){ return /^file:/i.test(u) || /^https?:\/\/(localhost|127\.0\.0\.1|0\.0\.0\.0)/i.test(u); }
      function libYukle(cb){
        if(window.qrcode){ cb(null); return; }
        var s=document.createElement('script'); s.src=LIB;
        s.onload=function(){ cb(window.qrcode?null:new Error('lib')); };
        s.onerror=function(){ cb(new Error('lib')); };
        document.head.appendChild(s);
      }
      function qrDataURL(text){ var qr=window.qrcode(0,'M'); qr.addData(text); qr.make(); return qr.createDataURL(6,12); }
      function kapat(){ var o=document.getElementById('zirve-qr-ort'); if(o) o.remove(); }

      function indir(url){
        if(!window.qrcode){ toast('QR henüz hazır değil','red'); return; }
        try{
          var durl=qrDataURL(url);
          var img=new Image();
          img.onload=function(){
            try{
              var c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
              var ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0);
              var png=c.toDataURL('image/png');
              var a=document.createElement('a'); a.href=png; a.download='qr-calisma.png';
              document.body.appendChild(a); a.click(); a.remove();
              toast('📥 QR (PNG) indirildi','green');
            }catch(e){ toast('İndirme yapılamadı','red'); }
          };
          img.src=durl;
        }catch(e){ toast('QR üretilemedi','red'); }
      }

      function ac(){
        if(document.getElementById('zirve-qr-ort')) return;
        var url=paylasUrl();
        var yerel=yerelMi(url);
        var html='<div id="zirve-qr-kutu">'
          +'<button class="zq-kapat" id="zirve-qr-kapat" title="Kapat">×</button>'
          +'<div class="zq-baslik">📲 Bu çalışmayı paylaş</div>'
          +'<div class="zq-alt1">Karşındaki kişi telefonunun kamerasıyla okutsun; çalışma anında onun cihazında açılır.</div>'
          +'<div class="zq-kart"><div class="zq-yukleniyor" id="zirve-qr-gorsel">QR hazırlanıyor…</div></div>'
          +'<div class="zq-url">'+url.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>'
          +(yerel?'<div class="zq-not">⚠️ Bu sayfa şu an bilgisayarında/yerelde açık. QR&#39;ın başka cihazda çalışması için çalışmanı önce internete (ör. GitHub Pages) yükle; sonra o adresin QR&#39;ını paylaş.</div>':'')
          +'<div class="zq-btns"><button class="zq-btn" id="zirve-qr-kopya">🔗 Linki kopyala</button><button class="zq-btn ikincil" id="zirve-qr-indir">⬇ PNG indir</button></div>'
          +'<div class="zq-ipucu">İpucu: Linki kopyalayıp WhatsApp veya mesaj olarak da gönderebilirsin.</div>'
          +'</div>';
        var ort=document.createElement('div'); ort.id='zirve-qr-ort'; ort.innerHTML=html;
        ort.addEventListener('click', function(e){ if(e.target===ort) kapat(); });
        document.body.appendChild(ort);
        var kbtn=document.getElementById('zirve-qr-kapat'); if(kbtn) kbtn.onclick=kapat;
        var kop=document.getElementById('zirve-qr-kopya'); if(kop) kop.onclick=function(){ try{ navigator.clipboard.writeText(url); toast('🔗 Link kopyalandı','green'); }catch(e){ toast('Kopyalanamadı','red'); } };
        var ind=document.getElementById('zirve-qr-indir'); if(ind) ind.onclick=function(){ indir(url); };
        // QR görselini üret
        libYukle(function(err){
          var hedef=document.getElementById('zirve-qr-gorsel'); if(!hedef) return;
          if(err){ hedef.textContent='QR yüklenemedi (internet?)'; return; }
          try{ var durl=qrDataURL(url); var img=document.createElement('img'); img.id='zirve-qr-gorsel'; img.alt='QR kodu'; img.src=durl; hedef.parentNode.replaceChild(img, hedef); }
          catch(e){ hedef.textContent='QR üretilemedi'; }
        });
      }
      // dışarıdan çağrı + url ayarı
      window.ZIRVE_paylasAc = ac;
      window.ZIRVE_paylasUrl = function(u){ PAYLAS.url = String(u||''); };

      function dugmeYap(){
        if(document.getElementById('zirve-qr-ac')) return;
        try{ if(localStorage.getItem(LS_GIZLI)==='1') return; }catch(e){}
        var b=document.createElement('div'); b.id='zirve-qr-ac'; b.title='QR ile paylaş';
        var ic=document.createElement('span'); ic.className='zqx-ic';
        ic.innerHTML='<span style="font-size:14px">📲</span><span>QR</span>';
        ic.addEventListener('click', ac);
        var x=document.createElement('button'); x.className='zqx-kapat'; x.textContent='×'; x.title='Bu düğmeyi gizle';
        x.addEventListener('click', function(e){ e.stopPropagation(); try{ localStorage.setItem(LS_GIZLI,'1'); }catch(e){} b.remove(); });
        b.appendChild(ic); b.appendChild(x);
        document.body.appendChild(b);
      }
      // ---- canlı göster/gizle + merkezi kontrol kaydı ----
      function qrGoster(){ try{ localStorage.removeItem(LS_GIZLI); }catch(e){} dugmeYap(); }
      function qrGizle(){ try{ localStorage.setItem(LS_GIZLI,'1'); }catch(e){} var q=document.getElementById('zirve-qr-ac'); if(q) q.remove(); }
      function qrAcik(){ try{ return localStorage.getItem(LS_GIZLI)!=='1'; }catch(e){ return true; } }
      try{ (window.ZIRVE_kontroller=window.ZIRVE_kontroller||[]).push({ id:'qr', etiket:'QR ile Paylaş', ikon:'📲', goster:qrGoster, gizle:qrGizle, acikMi:qrAcik }); }catch(e){}

      if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(dugmeYap,600); });
      else setTimeout(dugmeYap,600);
    })();
    </script>

    <!-- ===== ZİRVE KONTROLLERİ GERİ GETİR (gizlenen ×'li düğmeleri sıfırlar) ===== -->

            return true;

        try{

          localStorage.removeItem('zirve_karsilama_gizli');

    <!-- ===== ZİRVE BİÇİMLİ PAYLAŞIM MODÜLÜ (renk/vurgu koruyan görsel + renkli PDF + WhatsApp-uyumlu metin) ===== -->
    <script>
    (function(){
      var H2C='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
      var PDFLIB='https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js';
      function toast(m,r){ try{ if(window.ZIRVE && window.ZIRVE.toast){ window.ZIRVE.toast(m, r||'green'); } }catch(e){} }
      function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

      function libYukle(cb){
        if(window.html2canvas){ cb(); return; }
        var s=document.createElement('script'); s.src=H2C;
        s.onload=function(){ cb(); }; s.onerror=function(){ cb(new Error('lib')); };
        document.head.appendChild(s);
      }
      function jspdfYukle(cb){
        if(window.jspdf && window.jspdf.jsPDF){ cb(); return; }
        var s=document.createElement('script'); s.src=PDFLIB;
        s.onload=function(){ cb(); }; s.onerror=function(){ cb(new Error('pdflib')); };
        document.head.appendChild(s);
      }
      function stilEkle(){
        if(document.getElementById('zgp-stil')) return;
        var st=document.createElement('style'); st.id='zgp-stil';
        st.textContent=
          '#zgp-kart{position:fixed;left:-99999px;top:0;width:640px;box-sizing:border-box;border-radius:24px;overflow:hidden;background:#0b1220;z-index:-1}'+
          '#zgp-kart *{box-sizing:border-box}'+
          '.zgp-govde{padding:26px 28px;font:400 16.5px/1.75 -apple-system,Segoe UI,Roboto,system-ui,sans-serif;color:#e7ecf3;word-wrap:break-word;overflow-wrap:break-word}'+
          '.zgp-govde strong,.zgp-govde b{color:#34d399;font-weight:800}'+
          '.zgp-govde em,.zgp-govde i{color:#fcd34d;font-style:italic}'+
          '.zgp-govde h1,.zgp-govde h2,.zgp-govde h3,.zgp-govde h4{color:#a7f3d0;font-weight:800;margin:.7em 0 .35em;line-height:1.35}'+
          '.zgp-govde h1{font-size:1.4em}.zgp-govde h2{font-size:1.25em}.zgp-govde h3{font-size:1.12em}'+
          '.zgp-govde p{margin:.55em 0}'+
          '.zgp-govde ul{padding-left:1.35em;margin:.5em 0;list-style:disc}'+
          '.zgp-govde ol{padding-left:1.5em;margin:.5em 0;list-style:decimal}'+
          '.zgp-govde li{margin:.32em 0}'+
          '.zgp-govde blockquote{border-left:3px solid #34d399;padding:.1em 0 .1em 14px;margin:.6em 0;color:#cbd5e1;background:rgba(52,211,153,.06)}'+
          '.zgp-govde a{color:#7dd3fc;text-decoration:none}'+
          '.zgp-govde code{background:rgba(255,255,255,.08);border-radius:5px;padding:1px 5px;font-size:.9em;color:#fde68a}'+
          '.zgp-govde hr{border:none;border-top:1px solid rgba(255,255,255,.1);margin:.9em 0}';
        document.head.appendChild(st);
      }
      function kartYap(icHtml, baslik, altBaslik){
        stilEkle();
        var kart=document.createElement('div'); kart.id='zgp-kart';
        var head='<div style="padding:24px 28px 20px;background:linear-gradient(135deg,#065f46,#0b1220 80%);border-bottom:1px solid rgba(52,211,153,.25)">'+
          '<div style="font:800 21px -apple-system,Segoe UI,Roboto,system-ui,sans-serif;color:#fff;display:flex;align-items:center;gap:9px">✨ '+esc(baslik||'AI Analizi')+'</div>'+
          (altBaslik?'<div style="margin-top:5px;font:600 13px system-ui;color:#6ee7b7">'+esc(altBaslik)+'</div>':'')+
          '</div>';
        var govde='<div class="zgp-govde">'+(icHtml||'')+'</div>';
        var foot='<div style="padding:14px 28px;background:#070c15;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;font:600 12px system-ui;color:#7c8aa0">'+
          '<span style="color:#34d399;font-weight:800">📖 Kur\u2019an &amp; Siyer Atlas\u0131</span>'+
          '<span>yapay zek\u00e2 ile \u00fcretildi</span></div>';
        kart.innerHTML=head+govde+foot;
        return kart;
      }
      function indir(blob, ad){
        var url=URL.createObjectURL(blob);
        var a=document.createElement('a'); a.href=url; a.download=ad||'kuran-siyer-atlasi.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} },5000);
        toast('🖼️ Görsel kaydedildi — WhatsApp\u2019ta paylaşabilirsin.','green');
      }
      function kartaCiz(opts, cb){
        opts=opts||{};
        libYukle(function(err){
          if(err || !window.html2canvas){ cb(new Error('h2c')); return; }
          var kart=kartYap(opts.html||'', opts.baslik, opts.altBaslik);
          document.body.appendChild(kart);
          try{
            window.html2canvas(kart,{backgroundColor:'#0b1220',scale:Math.min(2,(window.devicePixelRatio||1)+1),useCORS:true,logging:false}).then(function(canvas){
              try{ kart.remove(); }catch(e){} cb(null, canvas);
            }).catch(function(){ try{ kart.remove(); }catch(e){} cb(new Error('render')); });
          }catch(e){ try{ kart.remove(); }catch(e2){} cb(new Error('render')); }
        });
      }
      window.ZIRVE_gorselPaylas=function(opts){
        opts=opts||{};
        toast('🖼️ Görsel hazırlanıyor…','green');
        kartaCiz(opts, function(err, canvas){
          if(err){ toast('Görsel için internet gerekli (kütüphane yüklenemedi).','red'); return; }
          canvas.toBlob(function(blob){
            if(!blob){ toast('Görsel oluşturulamadı.','red'); return; }
            var ad=(opts.dosyaAdi||'kuran-siyer-atlasi')+'.png';
            var dosya=null; try{ dosya=new File([blob],ad,{type:'image/png'}); }catch(e){}
            if(dosya && navigator.canShare && navigator.canShare({files:[dosya]})){
              navigator.share({files:[dosya], title:opts.baslik||'AI Analizi'}).catch(function(){ indir(blob,ad); });
            } else { indir(blob,ad); }
          },'image/png');
        });
      };
      window.ZIRVE_pdfPaylas=function(opts){
        opts=opts||{};
        toast('📄 PDF hazırlanıyor…','green');
        kartaCiz(opts, function(err, canvas){
          if(err){ toast('PDF için internet gerekli (kütüphane yüklenemedi).','red'); return; }
          jspdfYukle(function(e2){
            if(e2 || !(window.jspdf && window.jspdf.jsPDF)){ toast('PDF için internet gerekli (kütüphane yüklenemedi).','red'); return; }
            try{
              var imgData=canvas.toDataURL('image/png');
              var jsPDF=window.jspdf.jsPDF;
              var pdf=new jsPDF({orientation:'p', unit:'mm', format:'a4'});
              var pageW=pdf.internal.pageSize.getWidth();
              var pageH=pdf.internal.pageSize.getHeight();
              var imgW=pageW; var imgH=canvas.height*imgW/canvas.width;
              function zeminDoldur(){ pdf.setFillColor(11,18,32); pdf.rect(0,0,pageW,pageH,'F'); }
              var pos=0, kalan=imgH;
              zeminDoldur(); pdf.addImage(imgData,'PNG',0,pos,imgW,imgH,undefined,'FAST'); kalan-=pageH;
              while(kalan>0){ pos=kalan-imgH; pdf.addPage(); zeminDoldur(); pdf.addImage(imgData,'PNG',0,pos,imgW,imgH,undefined,'FAST'); kalan-=pageH; }
              var ad=(opts.dosyaAdi||'kuran-siyer-atlasi')+'.pdf';
              var blob=pdf.output('blob');
              var dosya=null; try{ dosya=new File([blob],ad,{type:'application/pdf'}); }catch(e){}
              if(dosya && navigator.canShare && navigator.canShare({files:[dosya]})){
                navigator.share({files:[dosya], title:opts.baslik||'AI Analizi'}).catch(function(){ try{ pdf.save(ad); toast('📄 PDF kaydedildi.','green'); }catch(e){} });
              } else { try{ pdf.save(ad); toast('📄 PDF kaydedildi — renkleriyle paylaşabilirsin.','green'); }catch(e){ toast('PDF kaydedilemedi.','red'); } }
            }catch(e){ toast('PDF oluşturulamadı.','red'); }
          });
        });
      };
      window.ZIRVE_whatsappMetin=function(md){
        if(!md) return '';
        var t=String(md).replace(/\r\n/g,'\n');
        var kodlar=[];
        t=t.replace(/```[\s\S]*?```/g,function(m){ kodlar.push(m); return '\u0000K'+(kodlar.length-1)+'\u0000'; });
        t=t.replace(/^\s{0,3}#{1,6}\s+(.+?)\s*#*\s*$/gm,function(_,x){ return '*'+x.trim()+'*'; });
        t=t.replace(/\*\*([^\n*]+?)\*\*/g,'\u0001$1\u0001').replace(/__([^\n_]+?)__/g,'\u0001$1\u0001');
        t=t.replace(/(^|[^\w*])\*([^\n*]+?)\*(?=[^\w*]|$)/g,'$1_$2_');
        t=t.replace(/(^|[^\w_])_([^\n_]+?)_(?=[^\w_]|$)/g,'$1_$2_');
        t=t.replace(/\u0001([^\u0001]+)\u0001/g,'*$1*');
        t=t.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'$1 ($2)');
        t=t.replace(/^\s*[-*+]\s+/gm,'• ');
        t=t.replace(/^\s*>\s?/gm,'');
        t=t.replace(/^\s{0,3}#{1,6}\s+/gm,'');
        t=t.replace(/\u0000K(\d+)\u0000/g,function(_,i){ return kodlar[+i]||''; });
        t=t.replace(/\n{3,}/g,'\n\n').trim();
        return t;
      };
    })();
    </script>

                    const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1]) : 24000;
                    
                    const binaryString = window.atob(inlineData.data);
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    
                    const numChannels = 1;
                    const bitsPerSample = 16;
                    const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
                    const blockAlign = numChannels * (bitsPerSample / 8);
                    const dataSize = bytes.length;
                    const buffer = new ArrayBuffer(44 + dataSize);
                    const view = new DataView(buffer);

                    const writeString = (offset, string) => {
                        for (let i = 0; i < string.length; i++) {
                            view.setUint8(offset + i, string.charCodeAt(i));
                        }
                    };

                    writeString(0, 'RIFF');
                    view.setUint32(4, 36 + dataSize, true);
                    writeString(8, 'WAVE');
                    writeString(12, 'fmt ');
                    view.setUint32(16, 16, true);
                    view.setUint16(20, 1, true);
                    view.setUint16(22, numChannels, true);
                    view.setUint32(24, sampleRate, true);
                    view.setUint32(28, byteRate, true);
                    view.setUint16(32, blockAlign, true);
                    view.setUint16(34, bitsPerSample, true);
                    writeString(36, 'data');
                    view.setUint32(40, dataSize, true);

                    new Uint8Array(buffer, 44).set(bytes);
                    const blob = new Blob([view], { type: 'audio/wav' });

                let surahNo = null;
                let ayahNo = null;
                const val = inputVal.trim();
                
                if (val.includes(':')) {
                    const parts = val.split(':');
                    surahNo = parseInt(parts[0]);
                    ayahNo = parseInt(parts[1]);
                } else {
                    const match = val.match(/^(.*?)\s+(\d+)$/);
                    if (match) {
                        const normalize = (str) => str.toLowerCase().replace(/['\-]/g, '').replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ü/g, 'u').replace(/ş/g, 's').replace(/ğ/g, 'g').replace(/ç/g, 'c').replace(/\s+/g, '');

                            if (normalizedObjName === searchName || normalizedObjName.includes(searchName)) {
                                surahNo = parseInt(num);
                                break;
                            }
                        }
                    }
                }
                
                if(surahNo > 0 && surahNo <= 114 && ayahNo > 0) {

                { ad: 'Turuncu', hex: '#fb923c' }, { ad: 'Mor', hex: '#c084fc' },

                if (!ann || !ann.stil) return {};
                const c = ann.renk || '#fde047';
                if (ann.stil === 'highlight') return { background: `linear-gradient(transparent 8%, ${c}44 8%, ${c}44 92%, transparent 92%)`, borderRadius: '3px', boxDecorationBreak: 'clone', WebkitBoxDecorationBreak: 'clone', padding: '0 2px' };

                if (ann.stil === 'strike') return { textDecoration: 'line-through', textDecorationColor: c, textDecorationThickness: '2px', textDecorationSkipInk: 'none' };
                return {};
            };
            const isaretGuncelle = (ayah, trText, patch) => {
                const uid = `${surah.number}:${ayah.numberInSurah}`;
                const mevcut = annotations[uid] || {};
                const yeni = { ...mevcut, ...patch, surahNo: surah.number, ayahNo: ayah.numberInSurah, surahName: trName, ayet: (trText || '').substring(0, 120) };
                setAnnotation(uid, yeni);

            React.useEffect(() => {
                if (!sessionStorage.getItem('jumpToAyah')) {
                    window.scrollTo(0, 0);
                }
            }, [surah]);

            React.useEffect(() => {
                setDetailLoading(true);
                
                const fetchSurahData = async () => {
                    try {
                        let arRes = await fetch(`https://api.alquran.cloud/v1/surah/${surah.number}/${reciterSource}`);
                        if (!arRes.ok) arRes = await fetch(`https://api.alquran.cloud/v1/surah/${surah.number}/ar.alafasy`);
                        
                        let trRes = await fetch(`https://api.alquran.cloud/v1/surah/${surah.number}/${mealSource}`);
                        if (!trRes.ok) {
                            trRes = await fetch(`https://api.alquran.cloud/v1/surah/${surah.number}/tr.yazir`);
                        }
                        
                        const dataAr = await arRes.json();
                        const dataTr = await trRes.json();
                        
                        setAyahs(dataAr.data.ayahs);
                        setTranslation(dataTr.data.ayahs);
                    } catch (e) {
                        console.error("Veri çekme hatası:", e);
                    } finally {
                        setDetailLoading(false);
                        const jumpAyah = sessionStorage.getItem('jumpToAyah');
                        if(jumpAyah) {
                            setTimeout(() => {
                                const el = document.getElementById(`ayah-${jumpAyah}`);
                                if(el) {
                                    const y = el.getBoundingClientRect().top + window.scrollY - 100;

                                    }, 3000); 
                                }
                                sessionStorage.removeItem('jumpToAyah');
                            }, 500);
                        }
                    }
                };

                fetchSurahData();
                
                if (typeof db !== 'undefined') {
                     try {
                        db.collection('artifacts').doc('kuran-siyer-app-v2')
                          .collection('public').doc('data')
                          .collection('siyer_contexts').doc(String(surah.number))
                          .get()
                          .then(doc => { if (doc && doc.exists) setRemoteContexts(doc.data()); })
                          .catch(() => {});
                     } catch(e) {}
                }

                            </div>

                            <div className="px-2"> <NuzulTimelineCard data={timelineData} /> </div>

                            const ann = annotations[uid];
                            const isFav = favorites.some(f => f.uid === `${surah.number}:${ayah.numberInSurah}`);
                            const isPlaying = playingAyah?.id === ayah.number;

                                ayahBgClass = 'bg-pink-950/30 border-l-4 border-pink-500 shadow-[0_0_15px_rgba(236,72,153,0.1)]';

                                ayahBgClass = 'bg-sky-950/30 border-l-4 border-sky-500 shadow-[0_0_15px_rgba(14,165,233,0.1)]';
                                specialBadge = <span className="absolute -top-3 right-4 text-[10px] bg-sky-500 text-white px-2 py-0.5 rounded-full font-bold flex items-center gap-1 shadow-md z-10"><Icons.GraduationCap size={12}/> Eğitim Ayeti</span>;

                                    <div className={`relative p-4 md:p-6 rounded-2xl transition-all mt-2 ${ayahBgClass} ${isLastRead ? 'ring-2 ring-emerald-500/50' : ''}`}>

                                        <div className="flex justify-between items-center mb-5 border-b border-slate-700/50 pb-3">

            const [aiImageLoading, setAiImageLoading] = React.useState(false);
            const [aiImageError, setAiImageError] = React.useState(null);
            
            const [isTtsPlaying, setIsTtsPlaying] = React.useState(false);
            const ttsAudioRef = React.useRef(new Audio());

            const [playingAyah, setPlayingAyah] = React.useState(null);
            const audioRef = React.useRef(new Audio());

            React.useEffect(() => {
                const body = document.getElementById('app-body');
                if (darkMode) {
                    body.classList.remove('bg-black');
                    body.classList.add('bg-slate-950');
                } else {
                    body.classList.remove('bg-slate-950');
                    body.classList.add('bg-black'); 
                }
            }, [darkMode]);

            const performDeepSearch = React.useCallback(async (query) => {
                if (query.length < 2) { setSearchResults([]); setSearchCount(0); return; }
                setIsSearching(true);
                setSearchResults([]); 
                setSearchCount(0);
                try {
                    const res = await fetch(`https://api.alquran.cloud/v1/search/${query}/all/${mealSource}`);
                    const data = await res.json();
                    
                    if (data.code === 200 && data.data && data.data.matches) {
                        setSearchResults(data.data.matches);
                        setSearchCount(data.data.count || data.data.matches.length);
                    } else {
                        setSearchResults([]);
                        setSearchCount(0);
                    }
                } catch (e) { 
                    console.error("Search error", e); 
                    setSearchResults([]);
                    setSearchCount(0);
                }
                finally { setIsSearching(false); }
            }, [mealSource]);

            React.useEffect(() => {
                const timer = setTimeout(() => {
                    if (searchQuery.length > 2) {
                        performDeepSearch(searchQuery);
                    } else {
                        setSearchResults([]);
                        setSearchCount(0);
                    }
                }, 500); 
                
                return () => clearTimeout(timer);
            }, [searchQuery, performDeepSearch]);

            React.useEffect(() => {
                setGeminiKey(localStorage.getItem('geminiApiKey') || '');
                setGeminiModel(localStorage.getItem('geminiModel') || 'gemini-2.5-flash');
                setMealSource(localStorage.getItem('mealSource') || 'tr.yazir'); 
                setReciterSource(localStorage.getItem('reciterSource') || 'ar.abdulbasitmurattal');
                setArabicFont(localStorage.getItem('arabicFont') || 'font-amiri');
                
                const savedLastRead = localStorage.getItem('lastRead');
                if(savedLastRead) setLastRead(JSON.parse(savedLastRead));
                
                const savedHatim = localStorage.getItem('hatim_progress');
                if(savedHatim) setHatimProgress(JSON.parse(savedHatim));
                
                const localFavs = localStorage.getItem('favs');
                if(localFavs) setFavorites(JSON.parse(localFavs));

                const localNotlar = localStorage.getItem('zirve_notlar');
                if(localNotlar) { try { setAnnotations(JSON.parse(localNotlar) || {}); } catch(e){} }

                const initAuth = async () => {
                    if (isFirebaseAvailable) {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await auth.signInWithCustomToken(__initial_auth_token);
                            else await auth.signInAnonymously();
                        } catch(e) { console.error("Auth", e); }
                    }
                };
                initAuth();
                if (isFirebaseAvailable) {
                    firebase.auth().onAuthStateChanged((currentUser) => {
                        setUser(currentUser);
                        if (currentUser) {
                             db.collection('artifacts').doc(appId).collection('users').doc(currentUser.uid).collection('favorites').doc('main')
                            .onSnapshot((docSnap) => { if (docSnap.exists) setFavorites(docSnap.data().list || []); }, (err) => {});
                             db.collection('artifacts').doc(appId).collection('users').doc(currentUser.uid).collection('annotations').doc('main')
                            .onSnapshot((docSnap) => { if (docSnap.exists) setAnnotations(docSnap.data().map || {}); }, (err) => {});
                        }
                    });
                }
                fetch('https://api.alquran.cloud/v1/surah').then(res => res.json()).then(data => { setSurahs(data.data); setLoading(false); });
            }, []);

            React.useEffect(() => {
                const audio = audioRef.current;
                const handleEnded = () => setPlayingAyah(null);
                audio.addEventListener('ended', handleEnded);
                if (playingAyah) {
                    audio.src = playingAyah.url;
                    audio.play().catch(e => console.error("Audio Error", e));
                } else { audio.pause(); }
                return () => { audio.removeEventListener('ended', handleEnded); audio.pause(); };
            }, [playingAyah]);

            React.useEffect(() => {
                const ttsAudio = ttsAudioRef.current;
                const handleTtsEnded = () => setIsTtsPlaying(false);
                ttsAudio.addEventListener('ended', handleTtsEnded);
                return () => {
                    ttsAudio.removeEventListener('ended', handleTtsEnded);
                    ttsAudio.pause();
                };
            }, []);

            const toggleAudio = (ayahUrl, id) => {
                if (playingAyah && playingAyah.id === id) setPlayingAyah(null);
                else setPlayingAyah({ url: ayahUrl, id });
            };

            const toggleHatimCuz = (index) => {
                const newProgress = [...hatimProgress];
                newProgress[index] = !newProgress[index];
                setHatimProgress(newProgress);
                localStorage.setItem('hatim_progress', JSON.stringify(newProgress));
            };

            const resetHatim = () => {
                if(confirm("Hatim ilerlemenizi sıfırlamak istediğinize emin misiniz?")) {
                    const resetArr = Array(30).fill(false);
                    setHatimProgress(resetArr);
                    localStorage.setItem('hatim_progress', JSON.stringify(resetArr));
                    showToast("Hatim ilerlemesi sıfırlandı.");
                }
            };

            const toggleFavorite = async (ayahData, surahInfo) => {
                const favItem = { surahNo: surahInfo.number, surahName: getTurkishName(surahInfo.number), ayahNo: ayahData.numberInSurah, text: ayahData.text.substring(0, 100) + (ayahData.text.length > 100 ? "..." : ""), uid: `${surahInfo.number}:${ayahData.numberInSurah}` };
                let newFavs = [...favorites];
                const isFav = favorites.some(f => f.uid === favItem.uid);
                
                if(isFav) {
                    newFavs = newFavs.filter(f => f.uid !== favItem.uid);
                    showToast("Favorilerden çıkarıldı");
                } else {
                    newFavs.push(favItem);
                    showToast("Favorilere eklendi");
                }
                
                setFavorites(newFavs); 
                localStorage.setItem('favs', JSON.stringify(newFavs));

                if (isFirebaseAvailable && user) {
                    const docRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('favorites').doc('main');
                    try {
                        if (isFav) await docRef.update({ list: firebase.firestore.FieldValue.arrayRemove(favorites.find(f => f.uid === favItem.uid)) });
                        else {
                            const doc = await docRef.get();
                            if (!doc.exists) await docRef.set({ list: [favItem] });
                            else await docRef.update({ list: firebase.firestore.FieldValue.arrayUnion(favItem) });
                        }
                    } catch(e) { console.warn("Firebase sync failed, using local"); }
                }
            };

            const setAnnotation = async (uid, meta) => {
                const next = { ...annotations };
                const bosNot = !(meta && meta.not && meta.not.trim());
                const bosStil = !(meta && meta.stil);
                if (!meta || (bosNot && bosStil)) { delete next[uid]; }
                else { next[uid] = meta; }
                setAnnotations(next);
                try { localStorage.setItem('zirve_notlar', JSON.stringify(next)); } catch(e){}
                if (isFirebaseAvailable && user) {
                    const docRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('annotations').doc('main');
                    try { await docRef.set({ map: next }); } catch(e) { console.warn("Firebase sync failed, using local"); }
                }
            };

            const clearAllFavorites = async () => {
                setFavorites([]);
                try { localStorage.setItem('favs', JSON.stringify([])); } catch(e){}
                if (isFirebaseAvailable && user) {
                    const docRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('favorites').doc('main');
                    try { await docRef.set({ list: [] }); } catch(e) { console.warn("Firebase sync failed, using local"); }
                }
                showToast("Tüm favoriler temizlendi");
            };

            const handleAiRequest = async (prompt, mode, useSearch = false) => {
                setAiMode(mode); setAiModalOpen(true); setAiLoading(true); setAiError(null);
                
                setIsTtsPlaying(false);
                ttsAudioRef.current.pause();

                try {
                    const result = await GeminiAPI.generateText(prompt, useSearch);
                    setAiContent(result);
                } catch (err) { setAiError(err.message); } finally { setAiLoading(false); }
            };
            
            const handleImageRequest = async (ayahText) => {
                setAiImageModalOpen(true); setAiImageLoading(true); setAiImageError(null); setAiImageUrl('');
                try {
                    const imagePrompt = `A beautiful, highly detailed, atmospheric, and symbolic Islamic art illustration representing the core meaning of this verse: "${ayahText}". IMPORTANT: No human faces, no animal faces. Focus on nature, light, cosmic elements, islamic geometric patterns, or serene landscapes. Masterpiece, 4k.`;
                    const url = await GeminiAPI.generateImage(imagePrompt);
                    setAiImageUrl(url);
                } catch (err) {
                    setAiImageError("Görsel üretilirken bir hata oluştu: " + err.message);
                } finally {
                    setAiImageLoading(false);
                }
            };

            const handleTTSPlay = async (text) => {
                if (isTtsPlaying) return; 
                setIsTtsPlaying(true);
                try {
                    const cleanText = text.replace(/[*#_`~]/g, '');
                    const audioUrl = await GeminiAPI.generateTTS(cleanText);
                    ttsAudioRef.current.src = audioUrl;
                    await ttsAudioRef.current.play();
                } catch (error) {
                    console.error("TTS Error:", error);
                    showToast("Seslendirilirken bir hata oluştu.");
                    setIsTtsPlaying(false);
                }
            };

            const handleGeneralChat = () => {
                if (!chatQuery.trim()) return;
                handleAiRequest(`Sen bilgili bir İslam Siyer rehberisin. Kullanıcının sorusu: "${chatQuery}". Cevap Markdown formatında olsun.`, 'chat');
            };

            const handleDuaRequest = (mood) => {
                const query = mood || duaQuery;
                if (!query.trim()) return;
                handleAiRequest(`Sen manevi bir rehbersin. Kullanıcı durumu: "${query}". Ona uygun bir dua, esma ve tavsiye ver.`, 'dua');
            };

            const handleRandomAyah = () => {
                if (surahs.length === 0) return;
                const randomSurahObj = surahs[Math.floor(Math.random() * surahs.length)];
                const randomAyahNumber = Math.floor(Math.random() * randomSurahObj.numberOfAyahs) + 1;
                
                setCurrentSurah(randomSurahObj);
                setView('surah');
                sessionStorage.setItem('jumpToAyah', randomAyahNumber);
            };

            if (loading) return <Loading />;

            return (
                <div className="font-sans antialiased">
                    <Toast message={toastMsg} visible={toastVisible} />
                    <ScrollToTop />

                    {view === 'home' && <Home 
                        surahs={surahs} 
                        searchQuery={searchQuery} 
                        setSearchQuery={setSearchQuery} 
                        setCurrentSurah={setCurrentSurah} 
                        setView={setView} 
                        chatQuery={chatQuery} 
                        setChatQuery={setChatQuery} 
                        handleGeneralChat={handleGeneralChat} 
                        duaQuery={duaQuery} 
                        setDuaQuery={setDuaQuery} 
                        handleDuaRequest={handleDuaRequest}
                        handleAiRequest={handleAiRequest}
                        setShowSettings={setShowSettings}
                        performDeepSearch={performDeepSearch}
                        searchResults={searchResults}
                        searchCount={searchCount}
                        isSearching={isSearching}
                        lastRead={lastRead}
                        setJumpModalOpen={setJumpModalOpen}
                        handleRandomAyah={handleRandomAyah}
                        showToast={showToast}
                    />}
                    
                    {view === 'surah' && currentSurah && <SurahDetail 
                        surah={currentSurah} 
                        setView={setView} 
                        handleAiRequest={handleAiRequest} 
                        handleImageRequest={handleImageRequest}
                        setShowSettings={setShowSettings}
                        playingAyah={playingAyah}
                        toggleAudio={toggleAudio}
                        toggleFavorite={toggleFavorite}
                        favorites={favorites}
                        annotations={annotations}
                        setAnnotation={setAnnotation}
                        fontSize={fontSize}
                        arabicFont={arabicFont}
                        lastRead={lastRead}
                        setLastRead={setLastRead}
                        highlightedSearch={searchQuery}
                        setJumpModalOpen={setJumpModalOpen}
                        mealSource={mealSource}
                        reciterSource={reciterSource}
                        showToast={showToast}
                    />}
                    
                    {view === 'favorites' && <Favorites 
                        favorites={favorites} 
                        toggleFavorite={toggleFavorite} 
                        clearAllFavorites={clearAllFavorites}
                        surahs={surahs} 
                        setCurrentSurah={setCurrentSurah} 
                        setView={setView} 
                        showToast={showToast}
                    />}

                    {view === 'hatim' && <HatimView
                        hatimProgress={hatimProgress}
                        toggleCuz={toggleHatimCuz}
                        setView={setView}
                        resetHatim={resetHatim}
                        handleAiRequest={handleAiRequest}
                    />}
                    
                    <SettingsModal 
                        isOpen={showSettings} 
                        onClose={() => setShowSettings(false)} 
                        geminiKey={geminiKey} 
                        setGeminiKey={setGeminiKey} 
                        geminiModel={geminiModel}
                        setGeminiModel={setGeminiModel}
                        fontSize={fontSize} 
                        setFontSize={setFontSize} 
                        mealSource={mealSource}
                        setMealSource={setMealSource}
                        reciterSource={reciterSource}
                        setReciterSource={setReciterSource}
                        arabicFont={arabicFont}
                        setArabicFont={setArabicFont}
                        showToast={showToast}
                    />
                    
                    <JumpToModal 
                        isOpen={jumpModalOpen}
                        onClose={() => setJumpModalOpen(false)}
                        setCurrentSurah={setCurrentSurah}
                        setView={setView}
                        surahs={surahs}
                        showToast={showToast}
                    />
                    
                    <AiAnalysisModal 
                        isOpen={aiModalOpen} 
                        onClose={() => {
                            setAiModalOpen(false);
                            setIsTtsPlaying(false);
                            ttsAudioRef.current.pause();
                        }} 
                        content={aiContent} 
                        isLoading={aiLoading} 
                        error={aiError} 
                        type={aiMode} 
                        handleTTSPlay={handleTTSPlay}
                        isTtsPlaying={isTtsPlaying}
                    />
                    
                    <AiImageModal
                        isOpen={aiImageModalOpen}
                        onClose={() => setAiImageModalOpen(false)}
                        imageUrl={aiImageUrl}
                        isLoading={aiImageLoading}
                        error={aiImageError}
                    />
                    
                    <div className="fixed bottom-0 left-0 right-0 py-3 px-6 flex justify-around items-center border-t border-slate-800 bg-slate-900/95 backdrop-blur-lg z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
                        <button onClick={() => setView('home')} className={`flex flex-col items-center gap-1 transition-colors ${view === 'home' ? 'text-emerald-500' : 'text-slate-500 hover:text-emerald-400'}`}><Icons.BookOpen size={24} /><span className="text-[10px] font-bold">Kuran</span></button>
                        <button onClick={() => setView('hatim')} className={`flex flex-col items-center gap-1 transition-colors ${view === 'hatim' ? 'text-emerald-500' : 'text-slate-500 hover:text-emerald-400'}`}><Icons.Grid size={24} /><span className="text-[10px] font-bold">Hatim</span></button>
                        <button onClick={() => setView('favorites')} className={`flex flex-col items-center gap-1 transition-colors ${view === 'favorites' ? 'text-rose-500' : 'text-slate-500 hover:text-rose-400'}`}><Icons.Heart size={24} fill={view === 'favorites' ? "currentColor" : "none"} /><span className="text-[10px] font-bold">Favoriler</span></button>
                        <button onClick={() => { setDarkMode(!darkMode); showToast(darkMode ? "OLED Siyah Modu Aktif" : "Varsayılan Tema Aktif"); }} className="flex flex-col items-center gap-1 text-slate-500 hover:text-amber-400 transition-colors">{darkMode ? <Icons.Sun size={24} /> : <Icons.Moon size={24} />}<span className="text-[10px] font-bold">Tema</span></button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<KuranSiyerApp />);
    </script>
</body>
</html>
